<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CANTOS AL CORDERO - Cuaresma</title>
<style>
:root[data-theme="dark"] {
    --bg-main: #0f172a;
    --bg-card: #1e293b;
    --bg-hover: #334155;
    --accent: #f59e0b;
    --accent-hover: #d97706;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border: #334155;
    --danger: #ef4444;
}
:root[data-theme="light"] {
    --bg-main: #fffdf7;
    --bg-card: #ffffff;
    --bg-hover: #eff6ff;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --text-main: #111827;
    --text-muted: #475569;
    --border: #dbeafe;
    --danger: #dc2626;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body {
    background-color: var(--bg-main);
    color: var(--text-main);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.app-layout-wrapper {
    display: flex;
    align-items: center;
    gap: 20px;
    height: 860px;
}

.phone-mockup {
    width: 420px;
    height: 860px;
    background-color: var(--bg-card);
    border-radius: 40px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    border: 12px solid #111;
}

.phone-notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 30px;
    background-color: #111;
    border-bottom-left-radius: 15px;
    border-bottom-right-radius: 15px;
    z-index: 100;
}

.app-header {
    background-color: var(--bg-card);
    padding: 45px 16px 12px 16px; 
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.back-arrow {
    color: var(--text-main);
    font-size: 18px;
    text-decoration: none;
    cursor: pointer;
}

.book-icon {
    color: var(--accent);
    font-size: 18px;
    line-height: 1;
}

.title-container h1 {
    font-size: 13px;
    font-weight: bold;
    color: var(--text-main);
    display: flex;
    align-items: center;
}

.header-var {
    background-color: #b45309; 
    color: #ffffff;
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 3px;
    margin-left: 4px;
}

.header-sub {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 1px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.theme-icon, .export-icon {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
}

.new-song-btn {
    background-color: var(--accent);
    color: var(--bg-main);
    font-size: 10px;
    font-weight: 600;
    border: none;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
}

.sidebar {
    flex: 1;
    background-color: var(--bg-main);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.sidebar-search {
    padding: 12px 16px 6px 16px;
}

.search-box {
    position: relative;
    width: 100%;
}

.search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 12px;
}

.search-input {
    width: 100%;
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px 8px 32px;
    color: var(--text-main);
    font-size: 12px;
    outline: none;
}
.search-input:focus { border-color: var(--accent); }

.filters-section {
    padding: 0 16px 8px 16px;
}

.filter-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
}

.filter-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
}

.tag {
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 12px;
    border: 1px solid var(--border);
    cursor: pointer;
    color: var(--text-muted);
    background-color: var(--bg-card);
}

.tag.active {
    background-color: var(--accent);
    color: var(--bg-main);
    border-color: var(--accent);
    font-weight: 600;
}

/* Estilos para Búsqueda Alfabética */
.alphabet-section {
    padding: 0 16px 10px 16px;
}

.alphabet-container {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    justify-content: center;
}

.alpha-btn {
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 9px;
    font-weight: bold;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
}

.alpha-btn:hover {
    background-color: var(--bg-hover);
    color: var(--text-main);
}

.alpha-btn.active {
    background-color: var(--accent);
    color: var(--bg-main);
    border-color: var(--accent);
}

.song-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.song-item {
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: left ;
    cursor: pointer;
    transition: background 0.2s;
}

.song-number { color: var(--text-muted); font-weight: 700; }
.song-number { color: var(--text-muted); font-weight: 700; }
.song-item:hover {
    background-color: var(--bg-hover);
}

.song-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-main);
}

.song-meta {
    display: flex;
    gap: 6px;
    font-size: 10px;
    color: var(--text-muted);
    align-items: center;
}
.badge-tone {
    color: var(--accent);
    font-weight: bold;
}

/* Pantalla de Proyección Integrada */
.projection-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-main);
    z-index: 200;
    display: none;
    flex-direction: column;
    overflow: hidden;
}
.projection-overlay.active {
    display: flex;
}
.projection-topbar {
    background-color: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 40px 10px 8px 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}
.projection-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

/* Panel Multimedia Exterior a la Derecha del Teléfono */
.external-media-sidebar {
    width: 300px;
    height: 100%;
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    display: none;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
.external-media-sidebar.active {
    display: flex;
}
.external-media-sidebar h3 {
    font-size: 13px;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
}
.media-box {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.media-box label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: bold;
}
.media-box iframe {
    width: 100%;
    height: 180px;
    border: none;
    border-radius: 8px;
}
.media-box audio {
    width: 100%;
    height: 36px;
}

.song-lyrics-container {
    font-family: "Courier New", Consolas, monospace;
    font-size: var(--lyrics-font-size, 13px);
    line-height: 1.4;
    text-align: left;
    width: 100%;
    max-width: 480px;
}
.song-line {
    margin-bottom: 10px;
    text-align: left;
}
.song-line.blank-line { margin-bottom: 4px; }
.chord-line {
    color: var(--accent);
    font-weight: bold;
    white-space: pre-wrap;
    min-height: 1em;
    text-align: left;
}
.chord-line.hidden {
    display: none !important;
}
.lyric-line {
    color: var(--text-main);
    white-space: pre-wrap;
    text-align: left;
}

.transposer-toolbar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: var(--bg-main);
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 10px;
    flex-wrap: wrap;
}

.app-footer {
    background-color: var(--bg-card);
    border-top: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.footer-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 10px;
    cursor: pointer;
    background: none;
    border: none;
}

.footer-item.active {
    color: var(--accent);
}

.footer-icon {
    font-size: 16px;
}

.home-indicator {
    width: 140px;
    height: 5px;
    background-color: var(--text-main);
    border-radius: 100px;
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0.5;
}

/* Modal configurado para ocupar 3/4 de la pantalla */
.modal-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.9);
    z-index: 300;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 16px;
}
.modal-overlay.active { display: flex; }
.modal-content {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    width: 75%;         
    max-width: 600px;   
    height: 75%;        
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}
.form-row { display: flex; gap: 10px; }
.form-group { flex: 1; margin-bottom: 6px; }
.form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.form-control { width: 100%; background: var(--bg-main); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text-main); font-size: 12px; outline: none; }
.btn { background: var(--bg-hover); color: var(--text-main); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--bg-main); font-weight: bold; border: none; }
.btn-danger { background: var(--danger); color: #fff; border: none; }

/* Estilos para impresión */
@media print {
    body { background: white; color: black; height: auto; overflow: auto; display: block; }
    .app-layout-wrapper { display: block; height: auto; }
    .phone-mockup { width: 100%; height: auto; border: none; border-radius: 0; box-shadow: none; background: white; }
    .phone-notch, .app-header, .app-footer, .home-indicator, .projection-topbar, .sidebar, .modal-overlay, .external-media-sidebar { display: none !important; }
    .projection-overlay { position: static; display: flex !important; background: white; color: black; padding: 0; }
    .song-lyrics-container { font-size: 14px; color: black; text-align: left; }
    .chord-line { color: #b45309 !important; text-align: left; }
    .lyric-line { color: black !important; text-align: left; }
}

/* Corrección de lectura: interlineado simple y canciones compactas */
.song-lyrics-container { line-height: 1 !important; text-align: left !important; }
.song-line { margin-bottom: 0 !important; line-height: 1 !important; text-align: left !important; }
.song-line.blank-line { margin-bottom: 0 !important; line-height: 1 !important; min-height: .45em; }
.lyric-line, .chord-line { line-height: 1 !important; text-align: left !important; }


/* ===== Adaptación móvil añadida: teléfonos y tabletas ===== */
html { width: 100%; min-width: 0; -webkit-text-size-adjust: 100%; }
body { min-width: 0; max-width: 100%; }
img, video, iframe, canvas, svg { max-width: 100%; }
button, .btn, a, input, select, textarea { touch-action: manipulation; }
@media screen and (max-width: 700px) {
  html, body { width: 100% !important; min-width: 0 !important; margin: 0 !important; }
  body { overflow-x: hidden !important; }
  .app-layout-wrapper { width: 100% !important; max-width: 100% !important; min-width: 0 !important; height: 100dvh !important; min-height: 100dvh !important; margin: 0 !important; padding: 0 !important; }
  .phone-mockup { width: 100% !important; max-width: 100% !important; min-width: 0 !important; height: 100dvh !important; min-height: 100dvh !important; margin: 0 !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
  .phone-notch, .home-indicator { display: none !important; }
  .app-layout, .app-container, .main-content, .content, .song-list, .songs-container { max-width: 100% !important; min-width: 0 !important; }
  .app-header { padding: 10px 12px !important; gap: 8px !important; }
  .app-header h1, .app-header .title { font-size: clamp(16px, 5vw, 21px) !important; line-height: 1.2 !important; }
  .app-header button, .app-header .btn, button, .btn { min-height: 40px; }
  .sidebar { width: min(84vw, 300px) !important; max-width: 84vw !important; }
  .song-item, .song-card, .song-row, .song-list-item { max-width: 100% !important; min-width: 0 !important; }
  .song-lyrics-container { width: 100% !important; max-width: 100% !important; overflow-wrap: anywhere !important; word-break: normal !important; white-space: normal !important; font-size: 16px !important; line-height: 1.35 !important; padding: 10px !important; text-align: left !important; }
  .song-line, .lyric-line, .chord-line { max-width: 100% !important; overflow-wrap: anywhere !important; white-space: pre-wrap !important; line-height: 1.35 !important; text-align: left !important; }
  .projection-overlay { max-width: 100vw !important; overflow-x: hidden !important; }
  .projection-content, .projection-panel, .modal-content { width: 100% !important; max-width: 100% !important; min-width: 0 !important; }
  .modal-overlay { position: fixed !important; inset: 0 !important; padding: 8px !important; overflow-y: auto !important; }
  .modal-content { height: auto !important; max-height: 92dvh !important; overflow-y: auto !important; padding: 14px !important; }
  .form-row { flex-wrap: wrap !important; }
  .form-group { min-width: 0 !important; }
  input, select, textarea { max-width: 100% !important; font-size: 16px !important; }
  table { display: block; max-width: 100%; overflow-x: auto; }
}
@media screen and (max-width: 380px) {
  .app-header { padding: 8px !important; }
  .song-lyrics-container { font-size: 15px !important; padding: 7px !important; text-align: left !important; }
  .btn { padding: 8px !important; }
}

/* Pantalla completa limpia: solo cerrar, título y canción completa */
#fullscreenCloseBtn{display:none;position:fixed;top:8px;right:10px;z-index:2147483647;width:auto;height:auto;padding:3px 5px;border:0!important;border-radius:0!important;background:transparent!important;color:inherit!important;font-size:10px!important;line-height:1.2;box-shadow:none!important;cursor:pointer;opacity:.65}
.projection-overlay:fullscreen,.projection-overlay.active:fullscreen{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;overflow:hidden!important;display:flex!important;flex-direction:column!important;background:#211936!important;color:#f3e8ff!important;padding:0!important}
.projection-overlay:fullscreen .projection-topbar,.projection-overlay.active:fullscreen .projection-topbar{display:none!important}
.projection-overlay:fullscreen #fullscreenCloseBtn,.projection-overlay.active:fullscreen #fullscreenCloseBtn{display:block!important}

.projection-overlay:fullscreen #projSongTitle,.projection-overlay.active:fullscreen #projSongTitle{display:block!important;width:100%!important;max-width:100%!important;font-size:clamp(22px,3vw,38px)!important;line-height:1.2!important;margin:0 auto 22px!important;padding:0 48px 12px!important;box-sizing:border-box!important;color:#f3e8ff!important;text-align:left!important}
.projection-overlay:fullscreen #projLyricsContainer,.projection-overlay.active:fullscreen #projLyricsContainer{width:100%!important;max-width:1100px!important;margin:0 auto!important;font-size:clamp(19px,2.2vw,30px)!important;line-height:1.35!important;text-align:left!important;overflow:visible!important}
.projection-overlay:fullscreen .song-line,.projection-overlay:fullscreen .lyric-line,.projection-overlay:fullscreen .chord-line{line-height:1.35!important;margin-bottom:0!important;white-space:pre-wrap!important;overflow-wrap:anywhere!important;text-align:left!important}
.projection-overlay:fullscreen .youtube-quick-link{display:none!important}
/* Al ocultar acordes, mantener interlineado simple y sin huecos */
.chord-line.hidden{display:none!important}.song-lyrics-container.chords-hidden,.chords-hidden .song-line{line-height:1!important;margin-bottom:0!important}

/* Corrección contraste y título en proyección a pantalla completa */
.projection-overlay:fullscreen,.projection-overlay.active:fullscreen{background:#211936!important;color:#f3e8ff!important}
.projection-overlay:fullscreen #fullscreenCloseBtn,.projection-overlay.active:fullscreen #fullscreenCloseBtn{top:12px!important;right:14px!important;left:auto!important;background:#f3e8ff!important;color:#211936!important;border:1px solid #d9c8f0!important}
.projection-overlay:fullscreen .projection-body,.projection-overlay.active:fullscreen .projection-body{padding:76px 5vw 32px!important;color:#f3e8ff!important}
.projection-overlay:fullscreen #projSongTitle,.projection-overlay.active:fullscreen #projSongTitle{position:relative!important;z-index:1!important;padding:0 64px 12px!important;margin:0 auto 22px!important;color:#f3e8ff!important;text-align:left!important}
.projection-overlay:fullscreen #projLyricsContainer,.projection-overlay.active:fullscreen #projLyricsContainer{color:#f3e8ff!important;text-align:left!important}
.projection-overlay:fullscreen #projLyricsContainer *,.projection-overlay.active:fullscreen #projLyricsContainer *{color:#f3e8ff!important;text-align:left!important}
.projection-overlay:fullscreen #projLyricsContainer .chord-line,.projection-overlay.active:fullscreen #projLyricsContainer .chord-line{color:#ffbf38!important;text-align:left!important}

</style>

        MIm\nque el Padre nos da.\n\n      SOL     MIm      DO\nTe cantamos, Imagen de Dios invisible,\n      SIm       MIm       LAm     RE     MIm\nte alabamos, oh Rey de justicia y Rey de paz.\n      SOL\nTe cantamos,\n   MIm       DO\nPrimicia de aquellos que duermen,\n      SIm     MIm      LAm\nte alabamos a Ti, el viviente,\n    RE      MIm\nprincipio y fin.\n\n      SOL       MIm      DO\nTe cantamos, Tú eres exaltado en la gloria,\n      SIm     MIm       LAm\nte alabamos a Ti que vendrás\n     RE     MIm\na juzgar la tierra.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=fL7x3z9wK8Y","watchUrl":"https://www.youtube.com/watch?v=fL7x3z9wK8Y"}]},{"id":11,"title":"Cena pascual","category":"Cuaresma","tone":"DO","youtube":"https://www.youtube.com/watch?v=heudaaZojQc","audio":"","rawText":"DO                      MIm\nEra el primer día de la fiesta\n           FA              SOL\nY se comía pan sin levadura\nREm                       SOL\nLos que le seguían se acercaron, preguntaron:\nDO             MIm         LAm\n¿Dónde quieres que te preparemos\nFA         SOL\nla cena pascual?\n\nDO                MIm\nEl Señor le contestó:\n         FA                 SOL\nen la ciudad encontrarán un hombre\nREm                       SOL\nque les guiará hasta el lugar\nDO              DO/SI          LAm\ndonde dirán que les mandó el maestro,\n        FA                     SOL  DO  SOL\ndonde dirán que les mandó el maestro.\n\nLAm                  MIm\nNo era una tarde cualquiera,\nFA               SOL\nera la tarde del jueves,\nLAm              MIm\nera aquel día de fiesta\nFA               SOL\nera la alianza naciente;\nLAm                       MIm\ndía en que el pan se hace cuerpo,\nFA                       SOL\ndía en que el vino es su sangre,\nLAm                 MIm\nsellando una nueva alianza,\nFA                   SOL DO\nla alianza de la esperanza.\n\nDO                      MIm\nJunto a la mesa en el lugar que compartían,\n     FA                           SOL\ndijo que uno de ellos lo traicionaría;\nREm                   SOL\naquel que comparte mi pan,\n         DO           DO/SI        LAm\nsobre la mesa está su mano al lado mío,\n         FA                        SOL  DO\nsobre la mesa está su mano al lado mío.\n\n   SOL       DO                       SOL\n// No quiero ser, Señor, quien te traicione\n        LAm                      MIm\ndame la fuerza, no negarte nunca más,\n   FA                    DO           SOL\ny compartir contigo esta pascua, esta pascua. //","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=heudaaZojQc","watchUrl":"https://www.youtube.com/watch?v=heudaaZojQc"}]},{"id":12,"title":"Hagan esto en memoria mía","category":"Cuaresma","tone":"SOL","youtube":"https://www.youtube.com/watch?v=5OG6GXV8AWw","audio":"","rawText":"SOL      SOLmaj7\nUna gran puerta abierta\nMIb      RE       SIm LAm\npara celebrar una fiesta\nDO     RE\ncomo Jesús quería,\nMIm         RE       DO         RE\ndonde a los pobres nada les cuesta:\nDO    SOL       LAm     RE\nhagan esto en memoria mía.\n\nSOL   SOLmaj7   MIb\nUna mirada compasiva\nRE         SIm      LAm\npara restaurar la vida\nDO      RE      MIm\nde verdadera alegría\n       RE        DO  RE\nen un abrazo de acogida:\nDO    SOL  LAm        RE\nhagan esto en memoria mía.\n\nLAm   RE         DO\nUna palabra verdadera\n      SOL      MIm RE\nque penetra el corazón\nSIm7b5 LAm     SIm    DO       SOL\nafirmando el Espíritu con valentía\nLAm       RE\npara amar con razón:\nDO    SOL       LAm   MIm SOL\nhagan esto en memoria mía.\n\nSOL    SOLmaj7\nUna sonrisa amiga,\nMIb              RE           SIm      LAm\nque invita a esa mesa nuestra tan querida\nDO      RE            MIm\npara partir el pan un día,\n    RE           DO    RE\nPan de esperanza compartida:\nDO    SOL       LAm     RE\nhagan esto en memoria mía.\n\nSOL   SOLmaj7      MIb\nUna común unión de vida\nRE         SIm     LAm\npara los seres humanos.\nDO      RE\nEn la Eucaristía\nMIm   RE       DO RE\ntodos somos hermanos:\nDO    SOL  LAm        RE\nhagan esto en memoria mía.\n\nLAm      RE          DO        SOL\nUn mundo de justicia y solidaridad\nMIm     RE\ncon los pequeños\nSIm7b5 LAm     SIm             DO\npara saciar el hambre en la historia\n  SOL         LAm      RE\nhaciendo vida estos sueños:\nDO    SOL       LAm     RE\nhagan esto en memoria mía.\n\nSOL        SOLmaj7    MIb\nUn cielo y una tierra nueva,\nRE          SIm         LAm\npromesa del Reino que camina,\nDO   RE\ny junto a María\nMIm    RE         DO RE\nsomos Iglesia peregrina:\nDO    SOL  LAm        DO RE SOL\nhagan esto en memoria mía.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=5OG6GXV8AWw","watchUrl":"https://www.youtube.com/watch?v=5OG6GXV8AWw"},{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=xPiLzDrpU3U","watchUrl":"https://www.youtube.com/watch?v=xPiLzDrpU3U"}]},{"id":13,"title":"Lava mis pies","category":"Cuaresma","tone":"RE","youtube":"https://www.youtube.com/watch?v=SIQeiFSJsiQ","audio":"","rawText":"Intro: RE  SOL  MIm  LA  RE  (2 veces)\n\nRE       LA      MIm          RE  LA\nLava mis pies, Señor, lava mi alma;\nRE       LA      MIm           SOL      LA\nlava mis pies, Señor, para ser digno de Ti.\nRE       LA      MIm            RE  LA\nQuiero lavar tus pies en mis hermanos;\nRE        LA      MIm           SOL     LA\nquiero imitar tu amor, viviendo para servir.\n\n         SIm          SOL\nHoy te levantas de la cena,\n   MIm                 LA\nte quitas el manto, preparas el agua\n         SIm             SOL\ny te arrodillas frente a mí,\n   MIm               LA\nme miras tan dulce y lleno de amor,\nSOL       LA     MIm         FA#m  LA\ntomas mis pies y lavas mis pecados.\n\n         SIm      SOL\nYo te pregunto \"Señor,\n    MIm             LA\n¿me vas a lavar los pies a mí?\"\n        SIm          SOL\ny me contestas tiernamente\n     MIm            LA\n\"Tú ahora no puedes comprender\n       SOL        LA\nlo que Yo estoy haciendo,\n      MIm          FA#m  LA\nlo comprenderás después\".\n\n        SIm         SOL\nMe descoloca verte así,\nMIm                LA\nver que el Maestro sirve al discípulo\n     SIm         SOL\ny me niego a aceptar\n         MIm                  LA\nque seas Tú quien me lave los pies a mí,\n     SOL             LA\npero sé que si no lo haces\n     MIm       FA#m   LA\nno podré compartir contigo.\n\n   SIm               SOL\n\"Entiendan lo que he hecho,\n  MIm               LA\nustedes me llaman Maestro y Señor\n  SIm         SOL\ny dicen la verdad.\n       MIm            LA\nSi Yo, siendo Señor y siendo Maestro\n    SOL           LA\nles he lavado los pies,\n     MIm          FA#m  LA\nháganlo también ustedes\"","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=SIQeiFSJsiQ","watchUrl":"https://www.youtube.com/watch?v=SIQeiFSJsiQ"}]},{"id":14,"title":"Ante la Cruz","category":"Cuaresma","tone":"MIm","youtube":"https://www.youtube.com/watch?v=KxmoYTV2dww","audio":"","rawText":"MIm LAm SI7  MIm LAm  SI7\nAnte la Cruz, ante la Cruz\nMIm    SOL         RE\nte ofrecemos las fatigas,\n                   MIm   DO RE   MIm\nte ofrecemos las caídas, ante la Cruz;\n       SOL         RE\nte ofrecemos las heridas,\n                      MIm   DO RE    MIm\nte ofrecemos nuestras vidas, ante la Cruz.\n\nMIm LAm SI7  MIm LAm  SI7\nAnte la Cruz, ante la Cruz\nMIm    SOL            RE\nte ofrecemos nuestras dudas,\n                       MIm     DO RE   MIm\nte ofrecemos nuestra angustia, ante la Cruz;\n       SOL         RE\nte ofrecemos las penurias,\n                   MIm     DO RE    MIm\nte ofrecemos las renuncias, ante la Cruz.\n\nMIm LAm SI7  MIm LAm  SI7\nAnte la Cruz, ante la Cruz\nMIm    SOL        RE\nte ofrecemos la pobreza,\n                   MIm      DO RE   MIm\nte ofrecemos las carencias, a \nDO         REm  MIm\ny transido de dolor;\nLAm\nuna lanza ha traspasado\nDO         REm MIm\nsu bendito corazón.\nLAm              REm   FA MIm\nFuente abriendo, por nosotros,\nLAm      REm MIm LAm\nde divina redención.\n\nLAm\nYa termina la gran obra\nDO            REm  MIm\nque su amor determinó;\nLAm\nencarnado, para darnos\nDO            REm  MIm\nVida eterna y salvación.\nLAm           REm      FA MIm\nOfreciendo el cuerpo y sangre\nLAm       REm MIm LAm\nen el leño de la cruz.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=7-eA6rzMAzM","watchUrl":"https://www.youtube.com/watch?v=7-eA6rzMAzM"}]},{"id":18,"title":"Venid, oh cristianos","category":"Cuaresma","tone":"DO","youtube":"https://www.youtube.com/watch?v=1fUbdFJaBNg","audio":"","rawText":"  DO                     SOL     DO\nVenid  oh cristianos, la cruz adoremos;\n                      SOL       DO\nla cruz ensalcemos de nuestro Jesús.\n\n   FA      DO        SOL         DO\nOh cruz adorable, yo te amo, te adoro.\n   FA        DO      SOL       DO\nde gracias tesoro, emblema de amor.\n\n   FA     DO         SOL     DO\nOh almas amantes, la cruz adoremos,\n   FA       DO       SOL      DO\nla voz levantemos, Jesús nos amó.\n\n   FA      DO       SOL       DO\nOh árbol divino. Oh fuente de gloria,\n FA      DO        SOL     DO\neterna memoria, de mi Redentor.\n\n FA         DO         SOL       DO\nAmemos, cristianos, la cruz del amado\n  FA            DO       SOL    DO\nJesús, que enclavado, en ella murió.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=1fUbdFJaBNg","watchUrl":"https://www.youtube.com/watch?v=1fUbdFJaBNg"}]},{"id":19,"title":"Stabat mater","category":"Cuaresma","tone":"FA","youtube":"https://www.youtube.com/watch?v=AHOGnpz3WVU","audio":"","rawText":"   FA\n1. Stabat Mater dolorósa\n   REm               DO\n   Juxta Crucem lacrimósa,\n   SIb              FA\n   Dum pendébat Fílius.\n\n   FA\n2. Cujus ánimam geméntem,\n   REm               DO\n   Contristátam et doléntem,\n   SIb               FA\n   Pertransívit gládius.\n\n   FA\n3. O quam tristis et afflícta\n   REm           DO\n   Fuit illa benedícta\n   SIb          FA\n   Mater Unigéniti!\n\n   FA\n4. Quæ mærébat et dolébat,\n   REm              DO\n   Pia Mater, dum vidébat\n   SIb             FA\n   Nati pœnas ínclyti.\n\n5. Quis est homo qui non fleret,\n   REm                 DO\n   Matrem Christi si vidéret\n   SIb              FA\n   In tanto supplício?\n\n   FA\n6. Quis non posset contristári,\n   REm                  DO\n   Christi Matrem contemplári\n   SIb              FA\n   Doléntem cum Fílio?\n\n   FA\n7. Pro peccátis suæ gentis\n   REm               DO\n   Vidit Jesum in torméntis,\n   SIb               FA\n   Et flagéllis súbditum.\n\n   FA\n8. Vidit suum dulcem natum\n   REm          DO\n   Moriéndo desolátum,\n   SIb             FA\n   Dum emísit spíritum.\n\n   FA\n9. Eia, Mater, fons amóris,\n   REm              DO\n   Me sentíre vim dolóris\n   SIb               FA\n   Fac, ut tecum lúgeam.\n\n    FA\n10. Fac, ut árdeat cor meum\n   REm                 DO\n    In amándo Christum Deum,\n    SIb             FA\n    Ut sibi compláceam.\n\n    FA\n11. Sancta Mater, istud agas,\n    REm            DO\n    Crucifíxi fige plagas\n    SIb           FA\n    Cordi meo válide.\n\n    FA\n12. Tui Nati vulneráti,\n    REm                DO\n    Tam dignáti pro me pati,\n    SIb             FA\n    Pœnas mecum dívide.\n\n    FA\n13. Fac me tecum pie flere,\n    REm            DO\n    Crucifíxo condolére,\n    SIb           FA\n    Donec ego víxero.\n\n    FA\n14. Juxta Crucem tecum stare,\n    REm          DO\n    Et me tibi sociáre\n    SIb              FA\n    In planctu desídero.\n\n    FA\n15. Virgo vírginum præclára,\n    REm               DO\n    Mihi jam non sis amára:\n    SIb                FA\n    Fac me tecum plángere.\n\n    FA\n16. Fac, ut portem Christi mortem,\n    REm              DO\n    Passiónis fac consórtem,\n    SIb             FA\n    Et plagas recólere.\n\n    FA\n17. Fac me plagis vulnerári,\n    REm             DO\n    Fac me Cruce inebriári,\n    SIb           FA\n    Et cruóre Fílii.\n\n    FA\n18. Flammis ne urar succénsus,\n    REm                  DO\n    Per te, Virgo, sim defénsus\n    SIb        FA\n    In die judícii.\n\n    FA\n19. Christe, cum sit hinc exíre,\n    REm                DO\n    Da per Matrem me veníre\n    SIb            FA\n    Ad palmam victóriæ.\n\n    FA\n20. Quando corpus moriétur,\n    REm             DO\n    Fac, ut ánimæ donétur\n    SIb           FA\n    Paradísi glória.\n\nFA-DO-FA\nAmén.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=AHOGnpz3WVU","watchUrl":"https://www.youtube.com/watch?v=AHOGnpz3WVU"}]},{"id":20,"title":"Stabat mater (en español)","category":"Cuaresma","tone":"FA","youtube":"https://www.youtube.com/watch?v=VDzkgbVkMtw","audio":"","rawText":"   FA\n1. La Madre piadosa estaba\n   REm                  DO\n   junto a la cruz y lloraba\n   SIb                 FA\n   mientras el Hijo pendía.\n\n   FA\n2. Cuya alma triste y llorosa,\n   REm              DO\n   traspasada y dolorosa,\n   SIb              FA\n   fiero cuchillo tenía.\n\n   FA\n3. ¡Oh, cuán triste y cuán aflicta\n   REm                DO\n   se vio la Madre bendita\n   SIb                 FA\n   de tantos tormentos llena!\n\n   FA\n4. Cuando triste contemplaba\n   REm          DO\n   y dolorosa miraba\n   SIb               FA\n   del Hijo amado la pena.\n\n   FA\n5. Y ¿cuál hombre no llorara,\n   REm                 DO\n   si a la Madre contemplara\n   SIb                  FA\n   de Cristo en tanto dolor?\n\n   FA\n6. Y ¿quién no se entristeciera\n   REm                 DO\n   Madre piadosa si os viera\n   SIb              FA\n   sujeta a tanto rigor?\n\n   FA\n7. Por los pecados del mundo\n   REm                   DO\n   vio a Jesús en tan profundo\n   SIb               FA\n   tormento la dulce Madre.\n\n   FA\n8. Vio morir al Hijo amado\n   REm               DO\n   que rindió desamparado,\n   SIb              FA\n   el espíritu a su Padre.\n\n   FA\n9. ¡Oh dulce fuente de amor!,\n   REm               DO\n   hazme sentir su dolor\n   SIb               FA\n   para que llore contigo.\n\n    FA\n10. Y que, por mi Cristo amado,\n    REm            DO\n    mi corazón abrasado\n    SIb                   FA\n    más viva en Él que conmigo.\n\n    FA\n11. Y, porque a amarle me anime,\n    REm             DO\n    en mi corazón imprime\n        SIb                FA\n    las llagas que tuvo en sí.\n\n    FA\n12. Y de tu Hijo, Señora,\n    REm             DO\n    divide conmigo ahora,\n    SIb                 FA\n    las que padeció por mí.\n\n    FA\n13. Hazme contigo llorar,\n    REm            DO\n    y de veras lastimar\n    SIb                   FA\n    de sus penas mientras vivo.\n\n    FA\n14. Porque acompañar deseo,\n    REm                  DO\n    en la Cruz, donde le veo\n    SIb             FA\n    tu corazón compasivo.\n\n    FA\n15. ¡Virgen de vírgenes santas!,\n    REm                DO\n    llore ya con ansias tantas:\n    SIb                    FA\n    que el llanto dulce me sea.\n\n    FA\n16. Porque su pasión y muerteten\n    REm                  DO\n    tenga en mi alma, de suerte\n    SIb                   FA\n    que siempre sus penas vea.\n\n    FA\n17. Haz que su Cruz me enamore,\n    REm                  DO\n    y que en ella viva y more,\n    SIb                 FA\n    de mi fe y amor indicio.\n\n    FA\n18. Porque me inflame y encienda,\n    REm            DO\n    y contigo me defienda\n    SIb              FA\n    en el día del juicio.\n\n    FA\n19. Haz que me ampare la muerte\n    REm                      DO\n    de Cristo, cuando en tan fuerte\n    SIb                  FA\n    trance vida y alma estén.\n\n    FA\n20. Porque, cuando quede en calma\n    REm                DO\n    el cuerpo, vaya mi alma\n    SIb              FA\n    a su eterna gloria.\n\nFA-DO-FA\nAmén.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=VDzkgbVkMtw","watchUrl":"https://www.youtube.com/watch?v=VDzkgbVkMtw"}]},{"id":21,"title":"Canción del perdón","category":"Cuaresma","tone":"LA","youtube":"https://www.youtube.com/watch?v=3vJ_NWIWgWQ","audio":"","rawText":"LA                     DO#m\nSeñor, mis brazos se cayeron\n    SIm           MI\nlas luces se escondieron\n   FA#m      DO#m\nno puedo caminar.\n   SIm         RE             MI\nRestáurame, restáurame esta herida,\n    LA LA7      RE    SIm             MI\nsin Ti no tengo vida, vamos juntos a amar.\n\n  RE      MI           FA#m\nSeñor, tu mano me ha tocado,\n   DO#m       RE       MI            LA MI\nya no tengo pecado, te vuelvo a encontrar.\n  RE      MI           FA#m\nSeñor, tu mano me ha tocado,\n   FA#7       SIm      MI            LA\nya no tengo pecado, te vuelvo a encontrar.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=3vJ_NWIWgWQ","watchUrl":"https://www.youtube.com/watch?v=3vJ_NWIWgWQ"}]},{"id":22,"title":"Frente a Ti estoy, Señor","category":"Cuaresma","tone":"RE","youtube":"","audio":"","rawText":"RE\nFrente a Ti estoy, Señor,\nSOL              RE\nvengo a pedir perdón,\nSOL  \t      RE\nborra mis pecados,\n         LA            RE   RE7\nlava mis penas, levántame.\n   SOL   LA\nPerdón Señor,\nFA#m \t   SIm\nhoy te fallé,\nSOL      LA          RE   RE7\ntoma mis manos y guíame.\n  SOL   LA   FA#m      SIm\nA Ti, Señor, me entregaré\nSOL      LA            RE\npara que pueda hoy renacer.\n\nRE\nFrente a Ti estoy, Señor,\nSOL              RE\nvengo a pedir perdón.","lines":[],"youtubeTracks":[]},{"id":23,"title":"Hijo pródigo","category":"Cuaresma","tone":"DO","youtube":"https://www.youtube.com/watch?v=5UnaDNd17_o","audio":"","rawText":"DO  MIb°  FAm  DO  FA  SOL  DO\n\nDO             MIb°\nHe vuelto a ti después de tanto tiempo, n             MIm        SI7       MIm\nperdona a tu pueblo, perdónale, Señor.\n\nMIm                      LAm   MIm\nPor tus profundas llagas crueles,\n                SI7       MIm\npor tus espinas y por tus hieles,\n   SI7       MIm\nperdónale, Señor.\n\nMIm                       LAm   MIm\nPor las heridas de pies y manos,\n               SI7     MIm\npor los azotes tan inhumanos,\n   SI7       MIm\nperdónale, Señor.\n\nMIm                           LAm   MIm\nPor los tres clavos que te clavaron\n              SI7       MIm\ny las espinas que te clavaron,\n   SI7       MIm\nperdónale, Señor.\n\nMIm                         LAm   MIm\nPor las tres horas de tu agonía,\n                     SI7       MIm\nen las que por Madre diste a María,\n   SI7       MIm\nperdónale, Señor.\n\nMIm                      LAm   MIm\nPor la abertura de tu costado,\n               SI7      MIm\nno estás eternamente enojado,\n   SI7       MIm\nperdónale, Señor.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=R-Mehn4YfYc","watchUrl":"https://www.youtube.com/watch?v=R-Mehn4YfYc"}]},{"id":29,"title":"Una vez más rezaré","category":"Cuaresma","tone":"RE","youtube":"https://www.youtube.com/watch?v=J9VAcH__uLc","audio":"","rawText":"RE\nUna vez más rezaré,\n     SIm\nde rodillas me pondré,\n      SOL             LA           RE LA\npuede ser que una vez más Él me perdone.\n     RE\nLe dirá que lucho en vano,\n      SIm\nque pequé pues soy humano,\n      SOL             LA           RE LA\npuede ser que una vez más Él me perdone.\n\n        RE           LA          SIm\nPara un Dios que conoció la tentación,\n                   SOL\nde un amigo la traición,\n      MIm            RE         LA\nyo no dudo Él me perdone, Dios amigo.\n\n      RE\nYo vi sufrir a mi hermano\n       SIm\ncuando faltaba una mano,\n      SOL             LA           RE LA\npuede ser que una vez más Él me perdone.\n      RE\nMurió pobre y desahuciado,\n       SIm\nyo con lo https://www.youtube.com/watch?v=https://www.youtube.com/watch?v=M2smnhaGhjY"}]},{"id":33,"title":"¡Te alabamos, Cristo, Rey de eterna gloria!","category":"Cuaresma","tone":"DO","youtube":"","audio":"","rawText":" DO          FA   MIm\n¡Te alabamos, Cristo,\nLAm          SOL   DO\nRey de eterna gloria!","lines":[],"youtubeTracks":[]},{"id":34,"title":"Cuaresma","category":"Cuaresma","tone":"SIm","youtube":"https://www.youtube.com/watch?v=Jo2ccd1ntF0","audio":"","rawText":"SIm   RE     LA        SIm\nEn Cuaresma, tiempo de prueba\nSOL        RE        MIm       FA#\nhasta el desierto me llevan, Señor\nMIm   LA     FA#         SIm\na ofrecer mi vida en oblación\nSOL     RE     LA          SIm\ncomo lo hizo Jesús en su Pasión.\n\nSIm   RE     LA          SIm\nEn Cuaresma, tiempo de espera\nSOL     RE         MIm       FA#\nen el desierto acompaño al Señor,\nMIm     LA\njunto a El (junto a El)\nFA#            SIm\npreparo el corazón (corazón)\nSOL     RE     LA         SI\npara el día de su Resurrección.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=Jo2ccd1ntF0","watchUrl":"https://www.youtube.com/watch?v=Jo2ccd1ntF0"}]},{"id":35,"title":"Espero confiado en el Señor","category":"Cuaresma","tone":"REm","youtube":"https://www.youtube.com/watch?v=ML6Z0Z28mmA","audio":"","rawText":"REm       DO            REm\nEspero confiado en el Señor;\n         DO          LA REm\ncierto estoy de su palabra.\n\nREm                           DO\nDesde el abismo clamo a Ti, Señor,\nLAm        REm\nescucha mi clamor;\nSIb                   FA\ntus oídos se vuelvan atentos\n     DO           REm\na la voz de mi plegaria.\n\nREm                         DO\nSi las culpas escudriñas, Señor,\nLAm                REm\n¿quién podra subsistir?\nSIb                               FA\nmas junto a Ti se encuentra el perdón;\n           DO           REm\npor lo que todos de veneran.\n\nREm                    DO\nMi alma espera en el Señor\nLAm                  REm\ncierto estoy de su palabra.\nSIb                      FA\nMas aguarda mi alma al Señor\n         DO          REm\nque al sereno la aurora.\n\nREm                        DO\nPues abriga el Señor misericordia\nLAm            REm\ny copiosa redención.\n      SIb              FA\nRedimirá el Señor a su pueblo\n   DO        REm\nde todas sus culpas.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=ML6Z0Z28mmA","watchUrl":"https://www.youtube.com/watch?v=ML6Z0Z28mmA"}]},{"id":36,"title":"Grande es la bondad","category":"Cuaresma","tone":"RE","youtube":"https://www.youtube.com/watch?v=d26-w-UfZk0","audio":"","rawText":"RE                           SOL\nNo hay amor más  grande en verdad\n           MIm\nque el que dona la vida\nLA       SIm   LA    RE\npor los ami----------gos.\n\nFA#m           SIm        LA\nYo quiero bendecirte cada día\nFA#m        SIm        LA\ny alabar tu nombre por siempre.\n\nSIm       LA    RE    MIm   LA   RE\nGrande es la bondad de nuestro Señor.\n\nFA#m                        SOL\nGrande es el Señor y muy laudable,\nFA#m                            SIm\ny en su gran grandeza no cabe medida.\n\nRE                           SOL\nNo hay amor más  grande en verdad\n           MIm\nque el que dona la vida\nLA       SIm   LA    RE\npor los ami----------gos.\n\nFA#m             SIm            LA\nCompasivo y entrañable es el Señor,\nFA#m     SIm   LA\ny grande en bondad.\n\nSIm       LA    RE    MIm   LA   RE\nGrande es la bondad de nuestro Señor.\n\nFA#m                   SOL\nBueno es el Señor para todos\nFA#m                       SIm\ny entrañable con todas sus obras.\n\nRE                           SOL\nNo hay amor más  grande en verdad\n           MIm\nque el que dona la vida\nLA       SIm  LA  RE\npor los ami-------gos.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=d26-w-UfZk0","watchUrl":"https://www.youtube.com/watch?v=d26-w-UfZk0"}]},{"id":37,"title":"Hágase tu voluntad","category":"Cuaresma","tone":"REm","youtube":"https://www.youtube.com/watch?v=acK5iYEA9L0","audio":"","rawText":"REm LAm\nHágase\nREm SOLm LAm\ntu voluntad\n\n     REm LAm\nPadre mío,\nREm SOLm LAm   REm\nsi es posible\n LAm     REm SOLm LAm\naparta de mí este cáliz.\n\nREm LAm\n    REm SOLm LAm REm      LAm\nPero no se haga lo que yo quiero,\nREm  LAm       REm  LAm  REm SOLm LAm\nsino lo que tú quieres.\n\nREm    LAm   REm SOLm LAm\nPadre, Padre,\n        REm        LAm\nsi esto no puede pasar\nREm     SOLm  LAm\nsin que yo lo beba,\nREm LAm REm SOLm LAm\nhágase tu voluntad.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=acK5iYEA9L0","watchUrl":"https://www.youtube.com/watch?v=acK5iYEA9L0"}]},{"id":38,"title":"No me eligieron ustedes","category":"Cuaresma","tone":"REm","youtube":"https://www.youtube.com/watch?v=omWOaEzqXKA","audio":"","rawText":"   REm               DO\n// No me eligieron ustedes,\n    SIb             LA\nfui yo quien los elegí.\n  REm            DO\nUstedes son mis amigos,\n             SIb\nserán mis testigos,\n           LA\nvivirán en mí. //","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=omWOaEzqXKA","watchUrl":"https://www.youtube.com/watch?v=omWOaEzqXKA"}]},{"id":39,"title":"Oh Padre, entre tus manos","category":"Cuaresma","tone":"LA","youtube":"https://www.youtube.com/watch?v=Xff4PlGlBLk","audio":"","rawText":"LA          DO#m    SIm   LA\nOh Padre, entre tus manos\n     SIm  RE   DO#\nmi espíritu entrego;\n   FA#m     DO#     FA#m  MI  LA\noh Padre, entre tus ma-------nos\n     RE   MI  LA\nmi espíritu entrego.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=Xff4PlGlBLk","watchUrl":"https://www.youtube.com/watch?v=Xff4PlGlBLk"},{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=g1wvsm2PDO0","watchUrl":"https://www.youtube.com/watch?v=g1wvsm2PDO0"}]},{"id":40,"title":"El trigo transformado","category":"Cuaresma","tone":"RE","youtube":"","audio":"","rawText":"RE\nEl trigo transformado\n    SOL\npor las sencillas manos,\n   LA                         RE  LA7\nes pan que hace fecundo, tu dolor.\nRE\nEl vino de esta mesa,\n    SOL\nque compartimos hoy,\n   LA                       RE   SOL   LA   SI7\nes signo de tu entrega, de amor.\n\nMI\nJesús de la esperanza,\n   LA\nhermano de los hombres\n   SI7                       MI   SI7\nla vida en pan y vino Tú nos das.\n\nMI\nOlvida nuestro cuerpo,\n   LA\nel trigo lastimado\n  SI7                 MI    LA   MI\ny muéstrate mi Cristo liberador.","lines":[],"youtubeTracks":[]},{"id":41,"title":"Camino de la cruz","category":"Cuaresma","tone":"LA","youtube":"https://www.youtube.com/watch?v=c0fXvn8XUrc","audio":"","rawText":"LA       MI       RE         LA\nSilencioso pasas, cargando tu cruz,\nRE          LA      LA/FA#   MI\ntu cruz que no es tuya, sino mía.\nLA         MI           RE          LA\nDescalzo sobre el polvo de tu querida tierra,\nRE            FA#m          MI\nque hoy te condena por amar a cualquiera.\nLA             MI         RE           LA\nPasas entre la gente, sin reprocharles nada,\nRE          FA#m              MI\ny miras silencioso que el camino se alarga.\n\nLA              MI\nCon los hombros hinchados\nRE              LA\npor llevar el madero,\nRE           FA#m            MI\nun madero cargado de pecados del pueblo.\nLA      MI          RE          LA\nAquel sacrificio en que culmina tu vida\nRE                       FA#m\nde treinta y tres cortos años,\n           MI\nlargamente sufrida.\n\nLA              MI           RE          LA\nTreinta y tres años de vida, hondo predicador,\nRE               FA#m              MI\nde tan noble Evangelio y tan noble misión,\nLA               MI\npa' estos palos naciste,\n           RE           LA\npa' salvar hombres como yo,\nRE          FA#m                  MI\ndébiles peregrinos que no entonan canción.\nLA           MI\nTú te mueres tantas veces\n   RE            LA\nen mi calle y mi nación,\nRE              FA#m                  MI\ny hoy, loco de amor, mueres de forma atroz.\n\nLA        MI       RE          LA\nTú no tenías cruz, buscaste las mías\nRE              FA#m           MI\ny por mucho que caigas, sin embargo caminas.\nLA          MI      RE     LA\nseguiré tus pasos, amigo Jesús,\nRE           FA#m      MI\nal final y locura, locura de cruz.\nLA         MI\nGracias, Señor, gracias,\nRE             LA\npor cargar con tu cruz,\nRE          FA#m        MI   RE LA\ntu cruz que no es tuya, sino mía.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=c0fXvn8XUrc","watchUrl":"https://www.youtube.com/watch?v=c0fXvn8XUrc"}]},{"id":42,"title":"Clavado en la cruz","category":"Cuaresma","tone":"RE","youtube":"https://www.youtube.com/watch?v=Ym7MwlZMjwQ","audio":"","rawText":"RE                         LA\nUna gota de sangre en la mejilla\nSOL                           RE\nuna corona de espinas y una herida\nLA                              SOL\nel hombre que se humilla por cumplir\n                  RE  LA\nla voluntad del Señor.\n\n              RE              LA\n// Clavado en la cruz el hijo de Dios murió\n             SOL  LA\nsu vida entregó\n     RE\npor amor. //\n\nRE                              LA\nEl camino que lleva hacia el calvario,\nSOL                     RE\nde caer y volver a levantarse,\nLA                       SOL\na los ojos, su madre con lágrimas\n              RE  LA\nle miró, con amor.\n\nRE                         LA\nCon la vista perdida te buscaba,\nSOL                       RE\nÉl confiaba en ti, en que compartías\n                             LA\nel dolor de morir por tus hermanos,\n    SOL      RE    LA\ny subir a la cruz, extender los brazos\n    SOL                   RE  LA\ny hacer la voluntad del Señor.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=Ym7MwlZMjwQ","watchUrl":"https://www.youtube.com/watch?v=Ym7MwlZMjwQ"}]},{"id":43,"title":"Cruz de amor","category":"Cuaresma","tone":"LAm","youtube":"https://www.youtube.com/watch?v=LQv3sfVbY0A","audio":"","rawText":"Intro: LAm - LAm/SOL - LAm/FA# - LAm/FA\n       LAm - LAm/SOL - LAm/FA# - LAm/FA - MI\n\nLAm                    LAm/SOL\nCargando la cruz con dolor\n       LAm/FA#  LAm/FA\nte aproximas al monte,\nLAm               LAm/SOL\ny la corona en tu frente\n      LAm/FA#              LAm/FA MI\nte proclama el más humilde Rey.\nLAm           LAm/SOL\nAl discípulo amado\n     LAm/FA#   LAm/FA\nle entregas Tu Madre,\nLAm           LAm/SOL\ny por la voluntad de tu Padre\n    LAm/FA#      LAm/FA\nencomiendas Tu Espíritu.\n\nLA                      RE\nTu cuerpo y Tu sangre entregas\n      REm             LA\npor nosotros, oh mi Señor\n                    RE\ny en Tu mirada se esconde\n      SIm                MI\nel misterio del Reino de Dios.\n\n   LA               SOL\nÉl es el Mesías, el Hijo de Dios,\nSIm              FA#m        MI\nsigan sus pasos, sientan su amor,\nLA                 SOL\nÉl nos enseña a cargar nuestra cruz,\nSIm         FA#m MI      LAm\ndía a día luchar por el amor.\n\nLAm - LAm/SOL - LAm/FA# - LAm/FA - MI\n\nLAm               LAm/SOL\nTú decidiste entregarte\n     LAm/FA# LAm/FA\npara la salvación.\nLAm                 LAm/SOL\nHoy me doy cuenta Señor\n            LAm/FA#         LAm/FA MI\nque el sufrimiento fue por amor.\n\nLAm               LAm/SOL\nTodo lo que proclamaste\n         LAm/FA#   LAm/FA\nfue para gloria de Dios,\nLAm              LAm/SOL\nahora nosotros debemos\n           LAm/FA#       LAm/FA MI\nseguir tus huellas y anunciarte.\n\nLA                      RE\nTu cuerpo y Tu sangre entregas\n      REm           LA\npor nosotros, oh mi Señor\n                    RE\ny en Tu mirada se esconde\n      SIm                MI\nel misterio del Reino de Dios.\n\n   LA               SOL\nÉl es el Mesías, el Hijo de Dios,\nSIm              FA#m        MI\nsigan sus pasos, sientan su amor,\nLA                 SOL\nÉl nos enseña a cargar nuestra cruz,\nSIm         FA#m MI      LA SOL SIm FA#m MI\ndía a día luchar por el amor.\n\nLA                 SOL\nÉl nos enseña a cargar nuestra cruz,\nSIm         FA#m MI      LAm LAm/SOL\ndía a día luchar por el amor\nLAm/FA#     LAm/FA MI      LA\ndía a día luchar   por el amor.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=LQv3sfVbY0A","watchUrl":"https://www.youtube.com/watch?v=LQv3sfVbY0A"},{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=0JOVxZLra6w?start=3071s","watchUrl":"https://www.youtube.com/watch?v=0JOVxZLra6w?start=3071s"},{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=Pg4jZdSD630","watchUrl":"https://www.youtube.com/watch?v=Pg4jZdSD630"}]},{"id":44,"title":"Déjate","category":"Cuaresma","tone":"DO","youtube":"https://www.youtube.com/watch?v=64Z57FdSTdI","audio":"","rawText":"Intro: DO  SOL7\n\n                   DO\nHace ya tiempo que comprendí:\nFA       SOL        DO\nTú me buscaste en todas partes;\nLAm                     REm\nla llama que un día empezó a fallar\nFA                  SOL\nTú no dejaste se apagase.\n\nSOL7                    DO\nYo no comprendo y digo ¿qué será?,\nFA         SOL        DO\nserá que estaba equivocado;\nLAm                       REm\ny he descubierto que este loco está\nFA                      SOL\nde amor muriendo porque le ame.\n\nSOL7             DO\nYo no he querido saber más\nFA      SOL      DO\nde la locura que me late\nLAm                   REm\npero la fiebre quiere regresar\nFA                   SOL\ny Él no dejó de predicarme.\n\nSOL7\nY Tú me dices:\nDO SOL  FA        SOL    LAm   MIm\nDéjate, que se consuma este fuego,\nFA         SOL         LAm  MIm\nno apagues ya más esta hoguera\nFA            RE         SOL    SOL7\nque si no hay fuego no habrá luz.\nDO SOL FA           SOL\nCréeme que estoy clavado\n   LAm     MIm\nporque te amo,\nFA         SOL         LAm MIm\nno encontrarás en otro lado\nFA           SOL          DO\nquien quiera ya morir por ti.\n\nSOL7                   DO\nNo tengas miedo, no te dejaré\nFA        SOL         DO\nlas veces que Tú me reclames,\nLAm                        REm\nYo gozo al ver que quieres regresar,\nFA                 SOL\nDéjame que Yo te levante.\nSOL7                     DO\nSeñor, no ves que quiero regresar\nFA      SOL     DO\npero me pesa mi pasado;\nLAm                REm\nacaso pides lo que no sé dar,\nFA                        SOL\nel tiempo me ha secado el alma.\n\nSOL7                       DO\nTanto he besado el suelo, ¿no lo ves?\nFA        SOL            DO\nmis manos se han cerrado tanto.\n LAm                    REm\n\"No te preocupes, te rescataré;\nFA                    SOL\nmi vida cambio por la tuya.\"\n\nSOL7\nY Tú me dices:\nDO SOL FA         SOL       LAm MIm\nDéjate, que se consuma este fuego,\nFA         SOL         LAm  MIm\nno apagues ya más esta hoguera\nFA            RE         SOL    SOL7\nque si no hay fuego no habrá luz.\nDO SOL FA           SOL\nCréeme que estoy clavado\n   LAm     MIm\nporque te amo,\nFA         SOL         LAm MIm\nno encontrarás en otro lado\nFA           RE       SOL   SOL7\nquien quiera ya morir por ti.\nDO SOL FA         SOL       LAm MIm\nDéjate, que se consuma este fuego,\nFA         SOL         LAm  MIm\nno apagues ya más esta hoguera\nFA          SOL        DO\nque Yo encendí en tu corazón.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=64Z57FdSTdI","watchUrl":"https://www.youtube.com/watch?v=64Z57FdSTdI"},{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=EMaPKw51CCQ","watchUrl":"https://www.youtube.com/watch?v=EMaPKw51CCQ"}]},{"id":45,"title":"Dura cadena","category":"Cuaresma","tone":"DO","youtube":"https://www.youtube.com/watch?v=5FdOvnaDmRY","audio":"","rawText":"DO        FA   SOL          DO\nTú tienes todo lo que yo no tengo,\nLAm      FA           RE           SOL\ntienes pureza en la mirada, tienes tiempo.\nDO        FA       SOL       DO\nTú tienes hambre y sed de justicia,\nLAm    FA         RE              SOL\ny la palabra perdonar está en tus venas.\n\n   FA     DO          SOL         LAm\n// Dura cadena la que me impide salir\nFA    DO             SOL\na conocer la luz del día. //\n\nDO        FA              SOL         DO\nTú tienes claro lo que es respirar profundo\nLAm     FA            RE        SOL\nsin aspirar lo que despide este mundo.\nDO       FA              SOL          DO\nTienes paciencia, tienes limpia la conciencia,\nLAm       FA          RE       SOL\ntienes el pecho desprovisto de dudas.\n\nDO        FA             SOL           DO\nFuiste al madero, fuiste libre y prisionero,\nLAm       FA            RE             SOL\ntienes consuelo en la palabra, eres sincero.\nDO        FA         SOL           DO\nCompartes todo y por todos te entregaste,\nLAm       FA          SOL          DO\ny en el momento que fallé, Tú no fallaste.\n\nDO        FA     SOL        FA  FAm  DO\nTú tienes todo y todo me lo das.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=5FdOvnaDmRY","watchUrl":"https://www.youtube.com/watch?v=5FdOvnaDmRY"}]},{"id":46,"title":"El amor de Cristo nos reúne","category":"Cuaresma","tone":"MI","youtube":"https://www.youtube.com/watch?v=ku7ip1Ii660","audio":"","rawText":"MI         SI7          MI\nEl amor de Cristo nos reúne\n           LA    SI7\nen la cena fraternal\n       LA                      MI\ncon la luz de nuestra fe en el alma\n            SI7         MI\n// acudamos juntos al altar//\n\nMI                  SI7\nA los hombres del desierto,\n                  MI\nmilagroso pan les dio\n     LA           SI7                       MI\ncomo signo del misterio que en la Cena consumó,\n               SI7  MI\nque en la Cena consumó.\n\nAl que coma de mi carne,\nal que beba de mi sangre\nle daré la vida eterna\n// en el reino de mi Padre. //\n\nCon afán he deseado que comamos esta Pascua\nantes que mi muerte llegue,\n// muerte que a los hombres salva. //\n\nCongregados en la cena,\nel Señor bendijo el pan;\ny en su cuerpo convertido\n// lo entregó a la humanidad. //\n\nLo que acabo yo de hacer\ndeberán hacerlo ustedes;\ny lo harán en mi memoria\n// hasta el día en que yo vuelva. //\n\n// Llegará el fin de los tiempos,\notra vez Jesús vendrá;\nlos que amaron y creyeron\n// para siempre reinarán. //","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=ku7ip1Ii660","watchUrl":"https://www.youtube.com/watch?v=ku7ip1Ii660"}]},{"id":47,"title":"El apóstol","category":"Cuaresma","tone":"DO","youtube":"https://www.youtube.com/watch?v=vMqidDs8Ml4","audio":"","rawText":"DO             SOL            LAm\nQué misión tan grande es ser apóstol,\nFA                      SOL\nseguir al Señor a donde vaya,\nDO           MI          LAm\nanunciar con gozo su Evangelio\n  DO7          FA\ny ser para los hombres\n     SOL         DO SOL\nportadores de su paz.\n\nTanto nos amó al despedirse\nen la Santa Cena aquella tarde,\nnos dio cono pan su propio cuerpo\ny su sangre como vino de fraternidad.\n\nTanto nos amó que un Viernes Santo\nclavado en la cruz, Cristo murió.\nY en su muerte Él nos dio la vida,\nvida de alegría, vida de hijos de Dios.\n\nAl vencer la muerte a los tres días,\nCristo a Galilea retornó,\nno teman que he vuelto a la vida,\nvida que nos salva, vida que acerca a Dios.\n\nY se apareció a sus amigos,\nhablándoles del Reino de Dios,\nmandó a bautizar a todo el mundo\ncon el agua y el Santo Espíritu de Amor.\n\nSe encontraban ya todos reunidos,\ncuando el día de Pentecostés\nsintieron cual fuego en el alma\ny corrieron pronto a manifestar su fe.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=vMqidDs8Ml4","watchUrl":"https://www.youtube.com/watch?v=vMqidDs8Ml4"}]},{"id":48,"title":"El huerto","category":"Cuaresma","tone":"SOL","youtube":"https://www.youtube.com/watch?v=jsJfNw_PVuw","audio":"","rawText":"SOL                MIm            DO\nSeñor, el huerto aquél donde Tú rezabas\n           RE             SOL\ncon gran dolor se transformó,\n        MIm             DO\nha dado fruto, ha dado amor\n             RE             SOL\npues Tú lo regaste con el sudor\n       SI7                 MIm\nque te provocó el peso del pecado,\n        DO      RE      SOL\nhasta dejarte a ti desangrado\n          SI7               MIm\ny allí tu muerte había comenzado\n        DO      RE   SOL\npara salvar a la humanidad,\n           DO                 SOL\ny al mismo hombre que te ha matado\n         RE               SOL\npara que nazca tu gran verdad.\n\n  SOL      MIm           DO\nSeñor, que día te traicionamos\n       RE          SOL\nperdónanos, perdónanos;\n        MIm              DO\nperdona todos nuestros pecados\n        RE                  SOL\ny todas nuestras faltas de amor\n          SI7               MIm\nhacia el amigo, hacia el hermano,\n             DO        RE   SOL\nhacia el que sufre por el dolor,\n         SI7              MIm\npor todo nuestro género humano\n          DO           RE   SOL\nsin distinción de edad ni color;\n        DO               SOL\nperdona cuando no te escuchamos\n           RE             SOL\nperdón por todo, perdón Señor.\n\n  SOL          MIm           DO\nSeñor, somos cobardes y te negamos\n          RE        SOL\nporque no tenemos valor,\n             MIm               DO\npues no entendemos que ser cristianos\n         RE            SOL\nquiere decir morir por Ti;\n        SI7             MIm\npor el amigo, por el hermano,\n           DO        RE   SOL\npor el que sufre por el dolor,\n         SI7              MIm\npor todo nuestro género humano\n          DO           RE   SOL\nsin distinción de edad ni color,\n             DO                SOL\nperdón, pues nuestra cruz rechazamos,\n           RE             SOL\nperdón por todo, perdón Señor.","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=jsJfNw_PVuw","watchUrl":"https://www.youtube.com/watch?v=jsJfNw_PVuw"}]},{"id":49,"title":"El que muere por mí","category":"Cuaresma","tone":"DO","youtube":"https://www.youtube.com/watch?v=P9V6lDnJr80","audio":"","rawText":"DO                 FA\nTodo empezó en una cruz\n                LAm                     SOL\ndonde un hombre murió y un Dios se entregó.\n     DO                 FA\nSilenciosa la muerte llegó,\n                LAm                       SOL\nextinguiendo la luz que en un grito se ahogó.\n\nDO                 FA\nViendo su faz de dolor\n             LAm             SOL\nuna madre lloró y su amigo calló;\n     DO                     FA\npero siendo una entrega de amor,\n            LAm         SOL      FA\nsu camino siguió y en algún otro lado\n    SOL         DO\nuna luz se encendió.\nFA              SOL               LAm\nSiendo hombre, amigo, esclavo y maestro,\n                          SOL        FA\nsiendo carga pesada, profesor y aprendiz,\n                 SOL\nentregó hasta su cuerpo\n               DO  SOL  MIm\nen el pan y la vid.\n\nLAm     FA           DO\nDesde entonces lo he visto\n    SOL      LAm\ncaminar a mi lado\n      FA            DO      SOL       LAm\na ese Dios que se humilla y muere por mí,\n      FA          DO           SOL      LAm\nes la barca en mi playa, el ruido del silencio\n        FA         DO         SOL     REm\nque se acerca a su hijo y me abraza feliz,\nFA                 SOL                DO\nque se acerca a su hijo y me abraza feliz.\n\nDO                   FA\nViendo un humilde calvario,\n              LAm              SOL\ncon rostro cansado, soporta la cruz.\n     DO                  FA\nY al verme rezando a sus pies\n             LAm    SOL         FA\nse olvida de Él, me toma en sus brazos\n      SOL       DO\ny me acoge otra vez Text":"RE           LA            SIm\nPara que mi amor no sea un sentimiento,\n         SOL         MIm        LA\ntan solo un deslumbramiento pasajero;\nFA#                  SIm\npara no gastar mis palabras más mías\n     SOL          MIm         LA\nni vaciar de contenido mi 'te quiero'.\nRE                LA         SIm\nQuiero hundir más hondo mi raíz en Ti\n       SOL        MIm           LA\ny cimentar en solidez éste, mi afecto,\nFA#                      SIm\npues mi corazón que es inquieto y es frágil\n      SOL           MIm           LA\nsólo acierta si se abraza a tu proyecto.\n\n     RE         LA\nMás allá de mis miedos,\n     SIm       FA#m    SOL\nmás allá de mi inseguridad,\n       MIm         LA\nquiero darte mi respuesta.\n       RE         LA          SIm\naquí estoy para hacer tu voluntad,\n             FA#m      SOL\npara que mi amor sea decirte sí\nLA         RE\nhasta el final.\n\nRE           LA          SIm\nDuermen su sopor y temen en el huerto,\n        SOL       MIm        LA\nni sus amigos acompañan al maestro;\nFA#                      SIm\nsi es hora de cruz es de fidelidades,\n        SOL         MIm            LA\npero el mundo nunca quiere aceptar esto.\nRE            LA              SIm\nDame a comprender, Señor, tu amor tan puro,\n         SOL          MIm           LA\namor que persevera en cruz, amor perfecto.\nFA#                    SIm\nDame serte fiel cuando todo es oscuro,\n     SOL            MIm         LA\npara que mi amor no sea un sentimiento.\n\n     RE         LA\nMás allá de mis miedos,\n     SIm       FA#m    SOL\nmás allá de mi inseguridad,\n       MIm         LA\nquiero darte mi respuesta.\n       RE         LA          SIm\naquí estoy para hacer tu voluntad,\n             FA#m      SOL\npara que mi amor sea decirte sí\nLA         RE SI7\nhasta el final.\n\nMI             SI7             DO#m\nNo es en las palabras ni es en las promesas\n           LA           FA#m       SI7\ndonde la historia tiene su motor secreto,\nSOL#                  DO#m\nsólo es el amor en la cruz madurado,\n    LA              FA#m       SI7\nel amor que mueve a todo el universo.\nMI         SI7            DO#m\nPongo mi pequeña vida hoy en tus manos\n          LA        FA#m        SI7\npor sobre mis seguridades y mis miedos,\nSOL#                DO#m\ny para elegir tu querer y no el mío,\n         LA        FA#m         SI7\nhazme en mi Getsemaní fiel y despierto.\n\n        MI         SI7\n// Más allá de mis miedos,\n     DO#m      SOL#m   LA\nmás allá de mi inseguridad,\n       FA#m        SI7\nquiero darte mi respuesta.\n       MI         SI7         DO#m\naquí estoy para hacer tu voluntad,\n             SOL#m     LA\npara que mi amor sea decirte sí\nSI7        MI\nhasta el final.//","lines":[],"youtubeTracks":[{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=_QWrbu-LjXw","watchUrl":"https://www.youtube.com/watch?v=_QWrbu-LjXw"},{"label":"YouTube / video","url":"https://www.youtube.com/watch?v=Smh-lP0bXx4","watchUrl":"https://www.youtube.com/watch?v=Smh-lP0bXx4"}]},{"id":51,"title":"Frente a Ti, oh Jesús","category":"Cuaresma","tone":"DO#m","youtube":"https://www.youtube.com/watch?v=ob0rc084yc4","audio":"","rawText":"Intro: DO#m - SI4 - LAsus2 - SOL#m(b13) (x2)\n\n  DO#m         SIsus4\nJesús, estás herido\n   SOL#m(b13)            DO#m\ntu alma y tu cuerpo entregados\n                    SIsus4\ntus ojos se cierran cansados\n     SOL#m(b13)         DO#m-SIsus4-LAsus2\ny un grito lloró tu abandono\n\nFA#m11  SOL#m(b13) LAsus2\nFrente a Ti, Oh Jesús\nFA#m11      SOL#m(b13) LAsus2\nfrente a ese llanto de amor\n       SIsus4 SOL#    DO#m\naquí estoy Jesús para Ti\nSIsus4   LAsus2   SOL#m(b13) DO#m7\nhoy te entrego mi vida y mi cruz\n\nDO#m - SI4 - LAsus2 - SOL#m(b13)\n\n  DO#m           SIsus4\nJesús, un miedo envuelve\n   SOL#m(b13)   DO#m\nmi corazón angustiado\n                      SIsus4\npues hoy te he negado tres veces\n  SOL#m(b13)         DO#m-SIsus4-LAsus2\ny no he sab function normalizarCancionesGuardadas(lista) {
    if (!Array.isArray(lista)) return lista;
    return lista.map(song => {
        if (!song || typeof song !== 'object') return song;
        const arreglar = value => String(value ?? '').replace(/\b(DO|RE|MI|FA|SOL|LA|SI|C|D|E|F|G|A|B)([#b]?)-(?=\s|$|[\/,)])/gi, '$1m');
        if (typeof song.rawText === 'string') {
            song.rawText = song.rawText.split('\n').map(line => arreglar(line)).join('\n');
        }
        if (Array.isArray(song.lines)) song.lines = song.lines.map(line => typeof line === 'string' ? arreglar(line) : line);
        return song;
    });
}

    if (m[2]==='#'||m[2]==='♯') idx++;
    if (m[2]==='b'||m[2]==='♭') idx--;
    return {root, accidental:m[2]||'', suffix:m[3]||'', index:((idx%12)+12)%12};
}
function transposeChord(chord, semitones) {
    if (!chord) return '';
    const names = ["Do", "Do#", "Re", "Re#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Si"];
    const pitch = {do:0,re:2,mi:4,fa:5,sol:7,la:9,si:11,c:0,d:2,e:4,f:5,g:7,a:9,b:11};
    const shift = Number(semitones)||0;
    const one = (part) => String(part).replace(/^((?:Do|Re|Mi|Fa|Sol|La|Si|[A-G]))([#♯b♭]?)(.*)$/i, (whole, root, accidental, suffix) => {
        let idx = pitch[root.toLowerCase()];
        if (idx === undefined) return whole;
        if (accidental === '#' || accidental === '♯') idx++;
        if (accidental === 'b' || accidental === '♭') idx--;
        idx = ((idx + shift) % 12 + 12) % 12;
        return names[idx] + suffix;
    });
    // Solo procesa líneas de acordes; normaliza las notas inglesas a nomenclatura española.
    return String(chord).replace(/(^|[\s|()\-–—])((?:Do|Re|Mi|Fa|Sol|La|Si|[A-G])(?:[#♯b♭])?(?:maj7|maj|min|dim|aug|sus\d?|add\d?|m|M|\d{1,2}|\(\d+\)|[+°º])*(?:\/(?:Do|Re|Mi|Fa|Sol|La|Si|[A-G])(?:[#♯b♭])?)?)(?=$|[\s|(),;\-–—])/gi, (whole, lead, token) => {
        const parts = token.split('/');
        return lead + parts.map(one).join('/');
    });
}
function looksLikeChordLine(line) {
    const t=String(line||'').trim(); if(!t) return false;
    // Acorde: raíz (Do..Si o A..G), alteración, sufijos (m, 7, maj7, sus4, dim, °...), bajo opcional (/Mi)
    // y acordes unidos con guion (DO#m-SI, LA-FA#m-SI). Se aceptan mayúsculas, minúsculas y mixtas.
    const R='(?:do|re|mi|fa|sol|la|si|[A-G])';
    const S='(?:maj7|maj|min|dim|aug|sus\\d?|add\\d?|m|M|\\d{1,2}[+\\-]?|\\(\\d+\\)|[+°º])*';
    const C=R+'[#♯b♭]?'+S+'(?:\\/'+R+'[#♯b♭]?)?';
    const valid=new RegExp('^(?:'+C+'(?:[-–—]'+C+')*|[|/()]+|[-–—]+|\\(?(?:bis|Bis)\\)?|[xX]\\d|\\/\\/)$','i');
    const starts=new RegExp('^\\(?'+R,'i');
    const clean=x=>{ let y=x.replace(/[.,;:]+$/,''); if(/^\(.+\)$/.test(y)) return y.slice(1,-1); return y.replace(/^\(+(?=.)/,'').replace(/(.)\)+$/,'$1'); };
    const tokens=t.split(/\s+/).filter(Boolean);
    return tokens.every(x=>valid.test(clean(x))||valid.test(x)) && tokens.some(x=>starts.test(x));
}
function splitSongText(song) {
    const source=(song.rawText && song.rawText.trim()) ? song.rawText : (song.lines||[]).map(l=>[l.chords,l.lyrics].filter(Boolean).join('\n')).join('\n');
    const lines=source.replace(/\r/g,'').split('\n');
    const out=[];
    for(let i=0;i<lines.length;i++){
        const line=lines[i];
        if(!line.trim()){out.push({chords:'',lyrics:' ',blank:true});continue;}
        if(looksLikeChordLine(line)){
            let lyrics='';
            if(i+1<lines.length && lines[i+1].trim() && !looksLikeChordLine(lines[i+1])) lyrics=lines[++i];
            out.push({chords:line,lyrics});
        } else out.push({chords:'',lyrics:line});
    }
    return out;
}

function renderAlphabet() {
    const container = document.getElementById('alphabetContainer');
    const letters = ['Todos', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'N', 'Ñ', 'O', 'P', 'Q', 'R', 'S', 'T', 'U', 'V', 'W', 'X', 'Y', 'Z'];
    
    container.innerHTML = '';
    letters.forEach(char => {
        const btn = document.createElement('button');

        if(char === 'Todos') {

    currentLetter = letter;

function filterSongs() {
    const queryRaw = (document.getElementById('searchInput')?.value || '').trim();
    const list = document.getElementById('songListContainer');
    if (!list) return;
    list.innerHTML = '';
    const getNumber = s => { const m=String(s.title||'').match(/^\s*(\d+)\s*[.\-)]/); return m ? m[1] : String(s.id ?? ''); };
    const getName = s => String(s.title||'').replace(/^\s*\d+\s*[.\-)]\s*/, '').replace(/^\s*-\d+-\s*/, '').trim();
    // Ignora tildes, mayúsculas/minúsculas y diferencias de espacios para buscar títulos o frases de la letra.
    const normalize = v => String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('es').replace(/[^\p{L}\p{N}]+/gu, ' ').replace(/\s+/g, ' ').trim();
    const needle = normalize(queryRaw);
    const filtered = songs.filter(s => {
        const title = getName(s);
        const matchesCat = currentFilter === 'todos' || s.category === currentFilter;
        // Busca en título, texto bruto, descripción y TODAS las líneas estructuradas de la canción.
        // Muchas canciones guardan la letra en s.lines y no en s.rawText; antes esas frases no se encontraban.
        const lineText = Array.isArray(s.lines) ? s.lines.map(line => {
            if (typeof line === 'string') return line;
            return [line?.lyrics, line?.chords, line?.text, line?.content].filter(Boolean).join(' ');
        }).join(' ') : '';
        const trackText = Array.isArray(s.youtubeTracks) ? s.youtubeTracks.map(t => [t?.title, t?.lyrics, t?.text].filter(Boolean).join(' ')).join(' ') : '';
        const searchableText = normalize([title, s.rawText, s.lyrics, s.description, s.text, lineText, trackText].filter(Boolean).join(' '));
        // Frases con puntuación/espacios variables y sin tildes se normalizan igual.
        const matchesQuery = !needle || searchableText.includes(needle);
        const matchesLetter = currentLetter === 'todos' || (currentLetter === 'Ñ' ? title.trim().toLocaleUpperCase('es').startsWith('Ñ') : normalize(title).startsWith(normalize(currentLetter)));
        return matchesCat && matchesQuery && matchesLetter;
    }).sort((a,b)=>getName(a).localeCompare(getName(b),'es',{sensitivity:'base'}));
    filtered.forEach(song => {
        const item = document.createElement('div');
        item.className = 'song-item';
        item.innerHTML = `<span class="song-title">${escapeHTML(getName(song))}</span><div class="song-meta"><span class="song-number">N.º ${escapeHTML(getNumber(song))}</span><span class="badge-tone">${escapeHTML(song.tone || 'Sin tono')}</span></div>`;
        item.onclick = () => projectSong(song.id);
        list.appendChild(item);
    });
    const count = document.getElementById('countDisplay');
    if (count) count.innerText = `${filtered.length} cantos`;
    const empty = document.getElementById('emptyState');
    if (empty) empty.style.display = filtered.length ? 'none' : 'block';
}
function escapeHTML(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
