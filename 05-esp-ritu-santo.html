<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CANTOS AL CORDERO - Espíritu Santo</title>
<style>
:root[data-theme="dark"] {
    --bg-main: #0f172a;
    --bg-card: #1e293b;
    --bg-hover: #334155;
    --accent: #f59e0b;
    --accent-hover: #d97706;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border: #334155;
    --danger: #ef4444;
}
:root[data-theme="light"] {
    --bg-main: #fffdf7;
    --bg-card: #ffffff;
    --bg-hover: #eff6ff;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --text-main: #111827;
    --text-muted: #475569;
    --border: #dbeafe;
    --danger: #dc2626;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body {
    background-color: var(--bg-main);
    color: var(--text-main);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.app-layout-wrapper {
    display: flex;
    align-items: center;
    gap: 20px;
    height: 860px;
}

.phone-mockup {
    width: 420px;
    height: 860px;
    background-color: var(--bg-card);
    border-radius: 40px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    border: 12px solid #111;
}

.phone-notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 30px;
    background-color: #111;
    border-bottom-left-radius: 15px;
    border-bottom-right-radius: 15px;
    z-index: 100;
}

.app-header {
    background-color: var(--bg-card);
    padding: 45px 16px 12px 16px; 
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
}

.header-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.back-arrow {
    color: var(--text-main);
    font-size: 18px;
    text-decoration: none;
    cursor: pointer;
}

.book-icon {
    color: var(--accent);
    font-size: 18px;
    line-height: 1;
}

.title-container h1 {
    font-size: 13px;
    font-weight: bold;
    color: var(--text-main);
    display: flex;
    align-items: center;
}

.header-var {
    background-color: #b45309; 
    color: #ffffff;
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 3px;
    margin-left: 4px;
}

.header-sub {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 1px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.theme-icon, .export-icon {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
}

.new-song-btn {
    background-color: var(--accent);
    color: var(--bg-main);
    font-size: 10px;
    font-weight: 600;
    border: none;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
}

.sidebar {
    flex: 1;
    background-color: var(--bg-main);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.sidebar-search {
    padding: 12px 16px 6px 16px;
}

.search-box {
    position: relative;
    width: 100%;
}

.search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 12px;
}

.search-input {
    width: 100%;
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px 8px 32px;
    color: var(--text-main);
    font-size: 12px;
    outline: none;
}
.search-input:focus { border-color: var(--accent); }

.filters-section {
    padding: 0 16px 8px 16px;
}

.filter-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
}

.filter-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
}

.tag {
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 12px;
    border: 1px solid var(--border);
    cursor: pointer;
    color: var(--text-muted);
    background-color: var(--bg-card);
}

.tag.active {
    background-color: var(--accent);
    color: var(--bg-main);
    border-color: var(--accent);
    font-weight: 600;
}

/* Estilos para Búsqueda Alfabética */
.alphabet-section {
    padding: 0 16px 10px 16px;
}

.alphabet-container {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    justify-content: center;
}

.alpha-btn {
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 9px;
    font-weight: bold;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
}

.alpha-btn:hover {
    background-color: var(--bg-hover);
    color: var(--text-main);
}

.alpha-btn.active {
    background-color: var(--accent);
    color: var(--bg-main);
    border-color: var(--accent);
}

.song-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.song-item {
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: left ;
    cursor: pointer;
    transition: background 0.2s;
}

.song-number { color: var(--text-muted); font-weight: 700; }
.song-number { color: var(--text-muted); font-weight: 700; }
.song-item:hover {
    background-color: var(--bg-hover);
}

.song-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-main);
}

.song-meta {
    display: flex;
    gap: 6px;
    font-size: 10px;
    color: var(--text-muted);
    align-items: center;
}
.badge-tone {
    color: var(--accent);
    font-weight: bold;
}

/* Pantalla de Proyección Integrada */
.projection-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-main);
    z-index: 200;
    display: none;
    flex-direction: column;
    overflow: hidden;
}
.projection-overlay.active {
    display: flex;
}
.projection-topbar {
    background-color: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 40px 10px 8px 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}
.projection-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

/* Panel Multimedia Exterior a la Derecha del Teléfono */
.external-media-sidebar {
    width: 300px;
    height: 100%;
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    display: none;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
.external-media-sidebar.active {
    display: flex;
}
.external-media-sidebar h3 {
    font-size: 13px;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
}
.media-box {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.media-box label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: bold;
}
.media-box iframe {
    width: 100%;
    height: 180px;
    border: none;
    border-radius: 8px;
}
.media-box audio {
    width: 100%;
    height: 36px;
}

.song-lyrics-container {
    font-family: "Courier New", Consolas, monospace;
    font-size: var(--lyrics-font-size, 13px);
    line-height: 1.4;
    text-align: left;
    width: 100%;
    max-width: 480px;
}
.song-line {
    margin-bottom: 10px;
    text-align: left;
}
.song-line.blank-line { margin-bottom: 4px; }
.chord-line {
    color: var(--accent);
    font-weight: bold;
    white-space: pre-wrap;
    min-height: 1em;
    text-align: left;
}
.chord-line.hidden {
    display: none !important;
}
.lyric-line {
    color: var(--text-main);
    white-space: pre-wrap;
    text-align: left;
}

.transposer-toolbar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: var(--bg-main);
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 10px;
    flex-wrap: wrap;
}

.app-footer {
    background-color: var(--bg-card);
    border-top: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.footer-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 10px;
    cursor: pointer;
    background: none;
    border: none;
}

.footer-item.active {
    color: var(--accent);
}

.footer-icon {
    font-size: 16px;
}

.home-indicator {
    width: 140px;
    height: 5px;
    background-color: var(--text-main);
    border-radius: 100px;
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0.5;
}

/* Modal configurado para ocupar 3/4 de la pantalla */
.modal-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.9);
    z-index: 300;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 16px;
}
.modal-overlay.active { display: flex; }
.modal-content {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    width: 75%;         
    max-width: 600px;   
    height: 75%;        
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}
.form-row { display: flex; gap: 10px; }
.form-group { flex: 1; margin-bottom: 6px; }
.form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.form-control { width: 100%; background: var(--bg-main); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text-main); font-size: 12px; outline: none; }
.btn { background: var(--bg-hover); color: var(--text-main); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--bg-main); font-weight: bold; border: none; }
.btn-danger { background: var(--danger); color: #fff; border: none; }

/* Estilos para impresión */
@media print {
    body { background: white; color: black; height: auto; overflow: auto; display: block; }
    .app-layout-wrapper { display: block; height: auto; }
    .phone-mockup { width: 100%; height: auto; border: none; border-radius: 0; box-shadow: none; background: white; }
    .phone-notch, .app-header, .app-footer, .home-indicator, .projection-topbar, .sidebar, .modal-overlay, .external-media-sidebar { display: none !important; }
    .projection-overlay { position: static; display: flex !important; background: white; color: black; padding: 0; }
    .song-lyrics-container { font-size: 14px; color: black; text-align: left; }
    .chord-line { color: #b45309 !important; text-align: left; }
    .lyric-line { color: black !important; text-align: left; }
}

/* Corrección de lectura: interlineado simple y canciones compactas */
.song-lyrics-container { line-height: 1 !important; text-align: left !important; }
.song-line { margin-bottom: 0 !important; line-height: 1 !important; text-align: left !important; }
.song-line.blank-line { margin-bottom: 0 !important; line-height: 1 !important; min-height: .45em; }
.lyric-line, .chord-line { line-height: 1 !important; text-align: left !important; }


/* ===== Adaptación móvil añadida: teléfonos y tabletas ===== */
html { width: 100%; min-width: 0; -webkit-text-size-adjust: 100%; }
body { min-width: 0; max-width: 100%; }
img, video, iframe, canvas, svg { max-width: 100%; }
button, .btn, a, input, select, textarea { touch-action: manipulation; }
@media screen and (max-width: 700px) {
  html, body { width: 100% !important; min-width: 0 !important; margin: 0 !important; }
  body { overflow-x: hidden !important; }
  .app-layout-wrapper { width: 100% !important; max-width: 100% !important; min-width: 0 !important; height: 100dvh !important; min-height: 100dvh !important; margin: 0 !important; padding: 0 !important; }
  .phone-mockup { width: 100% !important; max-width: 100% !important; min-width: 0 !important; height: 100dvh !important; min-height: 100dvh !important; margin: 0 !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
  .phone-notch, .home-indicator { display: none !important; }
  .app-layout, .app-container, .main-content, .content, .song-list, .songs-container { max-width: 100% !important; min-width: 0 !important; }
  .app-header { padding: 10px 12px !important; gap: 8px !important; }
  .app-header h1, .app-header .title { font-size: clamp(16px, 5vw, 21px) !important; line-height: 1.2 !important; }
  .app-header button, .app-header .btn, button, .btn { min-height: 40px; }
  .sidebar { width: min(84vw, 300px) !important; max-width: 84vw !important; }
  .song-item, .song-card, .song-row, .song-list-item { max-width: 100% !important; min-width: 0 !important; }
  .song-lyrics-container { width: 100% !important; max-width: 100% !important; overflow-wrap: anywhere !important; word-break: normal !important; white-space: normal !important; font-size: 16px !important; line-height: 1.35 !important; padding: 10px !important; text-align: left !important; }
  .song-line, .lyric-line, .chord-line { max-width: 100% !important; overflow-wrap: anywhere !important; white-space: pre-wrap !important; line-height: 1.35 !important; text-align: left !important; }
  .projection-overlay { max-width: 100vw !important; overflow-x: hidden !important; }
  .projection-content, .projection-panel, .modal-content { width: 100% !important; max-width: 100% !important; min-width: 0 !important; }
  .modal-overlay { position: fixed !important; inset: 0 !important; padding: 8px !important; overflow-y: auto !important; }
  .modal-content { height: auto !important; max-height: 92dvh !important; overflow-y: auto !important; padding: 14px !important; }
  .form-row { flex-wrap: wrap !important; }
  .form-group { min-width: 0 !important; }
  input, select, textarea { max-width: 100% !important; font-size: 16px !important; }
  table { display: block; max-width: 100%; overflow-x: auto; }
}
@media screen and (max-width: 380px) {
  .app-header { padding: 8px !important; }
  .song-lyrics-container { font-size: 15px !important; padding: 7px !important; text-align: left !important; }
  .btn { padding: 8px !important; }
}

/* Pantalla completa limpia: solo cerrar, título y canción completa */
#fullscreenCloseBtn{display:none;position:fixed;top:8px;right:10px;z-index:2147483647;width:auto;height:auto;padding:3px 5px;border:0!important;border-radius:0!important;background:transparent!important;color:inherit!important;font-size:10px!important;line-height:1.2;box-shadow:none!important;cursor:pointer;opacity:.65}
.projection-overlay:fullscreen,.projection-overlay.active:fullscreen{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;overflow:hidden!important;display:flex!important;flex-direction:column!important;background:#211936!important;color:#f3e8ff!important;padding:0!important}
.projection-overlay:fullscreen .projection-topbar,.projection-overlay.active:fullscreen .projection-topbar{display:none!important}
.projection-overlay:fullscreen #fullscreenCloseBtn,.projection-overlay.active:fullscreen #fullscreenCloseBtn{display:block!important}
.projection-overlay:fullscreen .projection-body,.projection-overlay.active:fullscreen .projection-body{display:block!important;flex:1 1 auto!important;width:100%!important;height:auto!important;min-height:0!important;overflow-y:auto!important;overflow-x:hidden!important;box-sizing:border-box!important;padding:78px 5vw 32px!important}
.projection-overlay:fullscreen #projSongTitle,.projection-overlay.active:fullscreen #projSongTitle{display:block!important;width:100%!important;max-width:100%!important;font-size:clamp(22px,3vw,38px)!important;line-height:1.2!important;margin:0 auto 22px!important;padding:0 48px 12px!important;box-sizing:border-box!important;color:#f3e8ff!important;text-align:left!important}
.projection-overlay:fullscreen #projLyricsContainer,.projection-overlay.active:fullscreen #projLyricsContainer{width:100%!important;max-width:1100px!important;margin:0 auto!important;font-size:clamp(19px,2.2vw,30px)!important;line-height:1.35!important;text-align:left!important;overflow:visible!important}
.projection-overlay:fullscreen .song-line,.projection-overlay:fullscreen .lyric-line,.projection-overlay:fullscreen .chord-line{line-height:1.35!important;margin-bottom:0!important;white-space:pre-wrap!important;overflow-wrap:anywhere!important;text-align:left!important}
.projection-overlay:fullscreen .youtube-quick-link{display:none!important}
/* Al ocultar acordes, mantener interlineado simple y sin huecos */
.chord-line.hidden{display:none!important}.song-lyrics-container.chords-hidden,.chords-hidden .song-line{line-height:1!important;margin-bottom:0!important}

/* Corrección contraste y título en proyección a pantalla completa */
.projection-overlay:fullscreen,.projection-overlay.active:fullscreen{background:#211936!important;color:#f3e8ff!important}
.projection-overlay:fullscreen #fullscreenCloseBtn,.projection-overlay.active:fullscreen #fullscreenCloseBtn{top:12px!important;right:14px!important;left:auto!important;background:#f3e8ff!important;color:#211936!important;border:1px solid #d9c8f0!important}
.projection-overlay:fullscreen .projection-body,.projection-overlay.active:fullscreen .projection-body{padding:76px 5vw 32px!important;color:#f3e8ff!important}
.projection-overlay:fullscreen #projSongTitle,.projection-overlay.active:fullscreen #projSongTitle{position:relative!important;z-index:1!important;padding:0 64px 12px!important;margin:0 auto 22px!important;color:#f3e8ff!important;text-align:left!important}
.projection-overlay:fullscreen #projLyricsContainer,.projection-overlay.active:fullscreen #projLyricsContainer{color:#f3e8ff!important;text-align:left!important}
.projection-overlay:fullscreen #projLyricsContainer *,.projection-overlay.active:fullscreen #projLyricsContainer *{color:#f3e8ff!important;text-align:left!important}
.projection-overlay:fullscreen #projLyricsContainer .chord-line,.projection-overlay.active:fullscreen #projLyricsContainer .chord-line{color:#ffbf38!important;text-align:left!important}
.projection-overlay:fullscreen .song-line,.projection-overlay:fullscreen .lyric-line,.projection-overlay.active:fullscreen .song-line,.projection-overlay.active:fullscreen .lyric-line{color:#f3e8ff!important;text-align:left!important}

</style>

function normalizarCancionesGuardadas(lista) {
    if (!Array.isArray(lista)) return lista;
    return lista.map(song => {
        if (!song || typeof song !== 'object') return song;
        const arreglar = value => String(value ?? '').replace(/\b(DO|RE|MI|FA|SOL|LA|SI|C|D|E|F|G|A|B)([#b]?)-(?=\s|$|[\/,)])/gi, '$1m');
        if (typeof song.rawText === 'string') {
            song.rawText = song.rawText.split('\n').map(line => arreglar(line)).join('\n');
        }
        if (Array.isArray(song.lines)) song.lines = song.lines.map(line => typeof line === 'string' ? arreglar(line) : line);
        return song;
    });
}
function getSongs() {
    // Android puede conservar datos locales antiguos o vacíos. Si no son válidos,
    // mostrar siempre las canciones incluidas en este HTML sin borrar los datos originales.
    try {
        const data = localStorage.getItem(DB_KEY);
        if (data) {
            const parsed = JSON.parse(data);
            if (Array.isArray(parsed) && parsed.length > 0) return normalizarCancionesGuardadas(parsed);
        }
    } catch (err) {
        console.warn('No se pudieron leer los datos locales del cantoral; se usarán las canciones incluidas.', err);
    }
    return normalizarCancionesGuardadas(defaultSongs.slice());
}

const noteSemitones = {"do":0,"re":2,"mi":4,"fa":5,"sol":7,"la":9,"si":11,"c":0,"d":2,"e":4,"f":5,"g":7,"a":9,"b":11};
function parseNote(noteStr) {
    const m = String(noteStr || '').trim().match(/^(Do|Re|Mi|Fa|Sol|La|Si|[A-G])([#♯b♭]?)(.*)$/i);
    if (!m) return {root:"Do", suffix:"", index:0};
    let root=m[1], idx=noteSemitones[root.toLowerCase()];
    if (m[2]==='#'||m[2]==='♯') idx++;
    if (m[2]==='b'||m[2]==='♭') idx--;
    return {root, accidental:m[2]||'', suffix:m[3]||'', index:((idx%12)+12)%12};
}
function transposeChord(chord, semitones) {
    if (!chord) return '';
    const names = ["Do", "Do#", "Re", "Re#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Si"];
    const pitch = {do:0,re:2,mi:4,fa:5,sol:7,la:9,si:11,c:0,d:2,e:4,f:5,g:7,a:9,b:11};
    const shift = Number(semitones)||0;
    const one = (part) => String(part).replace(/^((?:Do|Re|Mi|Fa|Sol|La|Si|[A-G]))([#♯b♭]?)(.*)$/i, (whole, root, accidental, suffix) => {
        let idx = pitch[root.toLowerCase()];
        if (idx === undefined) return whole;
        if (accidental === '#' || accidental === '♯') idx++;
        if (accidental === 'b' || accidental === '♭') idx--;
        idx = ((idx + shift) % 12 + 12) % 12;
        return names[idx] + suffix;
    });
    // Solo procesa líneas de acordes; normaliza las notas inglesas a nomenclatura española.
    return String(chord).replace(/(^|[\s|()\-–—])((?:Do|Re|Mi|Fa|Sol|La|Si|[A-G])(?:[#♯b♭])?(?:maj7|maj|min|dim|aug|sus\d?|add\d?|m|M|\d{1,2}|\(\d+\)|[+°º])*(?:\/(?:Do|Re|Mi|Fa|Sol|La|Si|[A-G])(?:[#♯b♭])?)?)(?=$|[\s|(),;\-–—])/gi, (whole, lead, token) => {
        const parts = token.split('/');
        return lead + parts.map(one).join('/');
    });
}

    // Acorde: raíz (Do..Si o A..G), alteración, sufijos (m, 7, maj7, sus4, dim, °...), bajo opcional (/Mi)
    // y acordes unidos con guion (DO#m-SI, LA-FA#m-SI). Se aceptan mayúsculas, minúsculas y mixtas.
    const R='(?:do|re|mi|fa|sol|la|si|[A-G])';
    const S='(?:maj7|maj|min|dim|aug|sus\\d?|add\\d?|m|M|\\d{1,2}[+\\-]?|\\(\\d+\\)|[+°º])*';
    const C=R+'[#♯b♭]?'+S+'(?:\\/'+R+'[#♯b♭]?)?';
    const valid=new RegExp('^(?:'+C+'(?:[-–—]'+C+')*|[|/()]+|[-–—]+|\\(?(?:bis|Bis)\\)?|[xX]\\d|\\/\\/)$','i');
    const starts=new RegExp('^\\(?'+R,'i');
    const clean=x=>{ let y=x.replace(/[.,;:]+$/,''); if(/^\(.+\)$/.test(y)) return y.slice(1,-1); return y.replace(/^\(+(?=.)/,'').replace(/(.)\)+$/,'$1'); };
    const tokens=t.split(/\s+/).filter(Boolean);
    return tokens.every(x=>valid.test(clean(x))||valid.test(x)) && tokens.some(x=>starts.test(x));
}
function splitSongText(song) {
    const source=(song.rawText && song.rawText.trim()) ? song.rawText : (song.lines||[]).map(l=>[l.chords,l.lyrics].filter(Boolean).join('\n')).join('\n');
    const lines=source.replace(/\r/g,'').split('\n');
    const out=[];
    for(let i=0;i<lines.length;i++){
        const line=lines[i];
        if(!line.trim()){out.push({chords:'',lyrics:' ',blank:true});continue;}
        if(looksLikeChordLine(line)){
            let lyrics='';
            if(i+1<lines.length && lines[i+1].trim() && !looksLikeChordLine(lines[i+1])) lyrics=lines[++i];
            out.push({chords:line,lyrics});
        } else out.push({chords:'',lyrics:line});
    }
    return out;
}

function renderAlphabet() {
    const container = document.getElementById('alphabetContainer');

    container.innerHTML = '';
    letters.forEach(char => {

function filterSongs() {
    const queryRaw = (document.getElementById('searchInput')?.value || '').trim();
    const list = document.getElementById('songListContainer');
    if (!list) return;
    list.innerHTML = '';
    const getNumber = s => { const m=String(s.title||'').match(/^\s*(\d+)\s*[.\-)]/); return m ? m[1] : String(s.id ?? ''); };
    const getName = s => String(s.title||'').replace(/^\s*\d+\s*[.\-)]\s*/, '').replace(/^\s*-\d+-\s*/, '').trim();
    // Ignora tildes, mayúsculas/minúsculas y diferencias de espacios para buscar títulos o frases de la letra.
    const normalize = v => String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('es').replace(/[^\p{L}\p{N}]+/gu, ' ').replace(/\s+/g, ' ').trim();
    const needle = normalize(queryRaw);
    const filtered = songs.filter(s => {
        const title = getName(s);
        const matchesCat = currentFilter === 'todos' || s.category === currentFilter;
        // Busca en título, texto bruto, descripción y TODAS las líneas estructuradas de la canción.
        // Muchas canciones guardan la letra en s.lines y no en s.rawText; antes esas frases no se encontraban.
        const lineText = Array.isArray(s.lines) ? s.lines.map(line => {
            if (typeof line === 'string') return line;
            return [line?.lyrics, line?.chords, line?.text, line?.content].filter(Boolean).join(' ');
        }).join(' ') : '';
        const trackText = Array.isArray(s.youtubeTracks) ? s.youtubeTracks.map(t => [t?.title, t?.lyrics, t?.text].filter(Boolean).join(' ')).join(' ') : '';
        const searchableText = normalize([title, s.rawText, s.lyrics, s.description, s.text, lineText, trackText].filter(Boolean).join(' '));
        // Frases con puntuación/espacios variables y sin tildes se normalizan igual.
        const matchesQuery = !needle || searchableText.includes(needle);
        const matchesLetter = currentLetter === 'todos' || (currentLetter === 'Ñ' ? title.trim().toLocaleUpperCase('es').startsWith('Ñ') : normalize(title).startsWith(normalize(currentLetter)));
        return matchesCat && matchesQuery && matchesLetter;
    }).sort((a,b)=>getName(a).localeCompare(getName(b),'es',{sensitivity:'base'}));
    filtered.forEach(song => {
        const item = document.createElement('div');
        item.className = 'song-item';
        item.innerHTML = `<span class="song-title">${escapeHTML(getName(song))}</span><div class="song-meta"><span class="song-number">N.º ${escapeHTML(getNumber(song))}</span><span class="badge-tone">${escapeHTML(song.tone || 'Sin tono')}</span></div>`;
        item.onclick = () => projectSong(song.id);
        list.appendChild(item);
    });
    const count = document.getElementById('countDisplay');
    if (count) count.innerText = `${filtered.length} cantos`;
    const empty = document.getElementById('emptyState');
    if (empty) empty.style.display = filtered.length ? 'none' : 'block';
}
function escapeHTML(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderProjection() {
    const song = songs.find(s => s.id === selectedSongId);
    if (!song) return;

    document.getElementById('projSongTitle').textContent = String(song.title || 'Canto sin título').replace(/^\s*[-–]?\d+[-.)]?\s*/, '').trim() || song.title;
    
    const parsed = parseNote(song.tone);
    const newIdx = (parsed.index + currentTransposeOffset + 12) % 12;
    document.getElementById('displayTone').innerText = chromaticScale[newIdx] + parsed.suffix;

    document.getElementById('projLyricsContainer').style.setProperty('--lyrics-font-size', currentFontSize + 'px');

    let html = '';
    splitSongText(song).forEach(line => {
        const chords = transposeChord(line.chords, currentTransposeOffset);
        const chordClass = (chordsVisible ? 'chord-line' : 'chord-line hidden') + ((!line.blank && !String(chords||'').trim()) ? ' no-chords' : '');
        html += `<div class="song-line${line.blank ? ' blank-line' : ''}"><div class="${chordClass}">${escapeHTML(chords) || '&nbsp;'}</div><div class="lyric-line">${escapeHTML(line.lyrics) || '&nbsp;'}</div></div>`;
    });
    document.getElementById('projLyricsContainer').innerHTML = html;

    const externalSidebar = document.getElementById('externalMediaSidebar');
    const youtubeContainer = document.getElementById('youtubeContainer');
    const youtubeFrame = document.getElementById('projYoutubeFrame');
    const audioContainer = document.getElementById('audioContainer');
    const audioElement = document.getElementById('projAudioElement');

    let hasMedia = false;

    const youtubeLink = document.getElementById('projYoutubeLink');
    const youtubeQuickLink = document.getElementById('projYoutubeQuickLink');
    const youtubeTracksBox = document.getElementById('projYoutubeTracks');
    if (youtubeTracksBox) youtubeTracksBox.innerHTML = '';
    if (youtubeQuickLink) {
        youtubeQuickLink.classList.remove('visible');
        youtubeQuickLink.href = '#';
    }
    const assignedTracks = Array.isArray(song.youtubeTracks) ? song.youtubeTracks : [];
    if (assignedTracks.length && youtubeTracksBox) {
        assignedTracks.forEach((track, index) => {
            const url = String(track.url || '').trim();
            if (!url) return;
            const embedMatch = url.match(/youtube\.com\/embed\/([^?&]+)/i);
            let embedUrl = url;
            if (!embedMatch && url.includes('watch?v=')) {
                const id = url.split('watch?v=')[1].split('&')[0];
                embedUrl = 'https://www.youtube.com/embed/' + id;
            } else if (url.includes('youtu.be/')) {
                const id = url.split('youtu.be/')[1].split('?')[0];
                embedUrl = 'https://www.youtube.com/embed/' + id;
            }
            const label = String(track.label || song.youtubeLabel || 'Pista de YouTube');
            const watch = String(track.watchUrl || url);
            const card = document.createElement('div');
            card.className = 'youtube-track-card';
            const title = document.createElement('div');
            title.className = 'youtube-track-title';
            title.textContent = label;
            const frame = document.createElement('iframe');
            frame.src = embedUrl;
            frame.title = 'YouTube: ' + label + ' — ' + (song.title || 'Canción');
            frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
            frame.setAttribute('allowfullscreen', '');
            frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
            const open = document.createElement('a');
            open.className = 'youtube-track-open';
            open.href = watch;
            open.target = '_blank';
            open.rel = 'noopener noreferrer';
            open.textContent = '▶ Abrir pista en YouTube';
            card.appendChild(title); card.appendChild(frame); card.appendChild(open);
            youtubeTracksBox.appendChild(card);
        });
        if (youtubeLink) { youtubeLink.style.display = 'none'; youtubeLink.href = '#'; }
        if (youtubeFrame) { youtubeFrame.src = ''; youtubeFrame.style.display = 'none'; }
        if (youtubeQuickLink) {
            youtubeQuickLink.href = String(assignedTracks[0].watchUrl || assignedTracks[0].url || '#');
            youtubeQuickLink.classList.add('visible');
        }
        youtubeContainer.style.display = 'flex';
        hasMedia = true;
    } else if (song.youtube && song.youtube.trim() !== "") {
        if (youtubeQuickLink) { youtubeQuickLink.href = song.youtube.trim(); youtubeQuickLink.classList.add('visible'); }
        const rawYoutube = song.youtube.trim();
        if (rawYoutube.includes('youtube.com/results?') || rawYoutube.includes('youtube.com/results/')) {
            youtubeLink.href = rawYoutube;
            youtubeLink.style.display = 'block';
            youtubeFrame.src = '';
            youtubeFrame.style.display = 'none';
        } else {
            let ytUrl = rawYoutube;
            if (ytUrl.includes('watch?v=')) {
                const id = ytUrl.split('watch?v=')[1].split('&')[0];
                ytUrl = 'https://www.youtube.com/embed/' + id;
            } else if (ytUrl.includes('youtu.be/')) {
                const id = ytUrl.split('youtu.be/')[1].split('?')[0];
                ytUrl = 'https://www.youtube.com/embed/' + id;
            }
            youtubeLink.href = '#';
            youtubeLink.style.display = 'none';
            youtubeFrame.style.display = 'block';
            youtubeFrame.src = ytUrl;
        }
        youtubeContainer.style.display = 'flex';
        hasMedia = true;
    } else {
        if (youtubeFrame) { youtubeFrame.src = ''; youtubeFrame.style.display = 'block'; }
        if (youtubeLink) { youtubeLink.href = '#'; youtubeLink.style.display = 'none'; }
        youtubeContainer.style.display = 'none';
    }

    if (song.audio && song.audio.trim() !== "") {
        audioElement.src = song.audio.trim();
        audioContainer.style.display = 'flex';
        hasMedia = true;
    } else {
        audioElement.pause();
        audioElement.src = '';
        audioContainer.style.display = 'none';
    }

    if (hasMedia) {
        externalSidebar.classList.add('active');
    } else {
        externalSidebar.classList.remove('active');
    }
}

        container.querySelectorAll('.lyric-line, .chord-line').forEach(el => el.style.setProperty('font-size', currentFontSize + 'px', 'important'));

        songs.forEach(s => {

function saveSong() {
    const id = document.getElementById('editSongId').value;
    let titleInput = document.getElementById('inputTitle').value.trim();
    const category = document.getElementById('inputCategory').value;
    const tone = document.getElementById('inputTone').value;
    const youtube = document.getElementById('inputYoutube').value.trim();
    const audio = document.getElementById('inputAudio').value.trim();
    const rawText = document.getElementById('inputRawLyrics').value;
    const raw = rawText.split('\n');
    let lines = [];
    for (let i = 0; i < raw.length; i += 2) {
        lines.push({ chords: raw[i] || '', lyrics: raw[i + 1] || '' });
    }

    if (!titleInput) {
        alert('Escribe el título de la canción antes de guardar.');
        return;
    }

    if (id) {
        const song = songs.find(item => String(item.id) === String(id));
        if (song) {
            song.title = titleInput;
            song.category = category;
            song.tone = tone;
            song.youtube = youtube;
            song.audio = audio;
            song.lines = lines;
            song.rawText = rawText;
        }
    } else {
        // El correlativo se calcula desde los títulos existentes, no desde el ID ni la fecha.
        // El correlativo debe continuar después del último número o, si el catálogo
        // todavía tiene títulos sin prefijo, después de la cantidad de canciones existentes.
        let maxNum = 0;
        songs.forEach(song => {
            const match = String(song.title || '').match(/^\s*-\s*(\d+)\s*-/);
            if (match) maxNum = Math.max(maxNum, parseInt(match[1], 10));
            if (Number.isFinite(Number(song.id)) && Number(song.id) > maxNum) maxNum = Number(song.id);
        });
        const nextNum = Math.max(maxNum, songs.length) + 1;
        // Evita conservar un correlativo escrito manualmente que sea incorrecto.
        titleInput = titleInput.replace(/^\s*-\s*\d+\s*-\s*/, '').trim();
        titleInput = `-${nextNum}- ${titleInput}`;
        songs.push({
            id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `song-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
            title: titleInput, category, tone, youtube, audio, lines, rawText
        });
    }

    try {
        localStorage.setItem(DB_KEY, JSON.stringify(songs));
    } catch (err) {
        alert('No se pudo guardar en el navegador. Puede estar lleno el almacenamiento.');
        return;
    }
    closeSongModal();
    filterSongs();

    if (document.getElementById('projectionOverlay')?.classList.contains('active') &&
        String(selectedSongId) === String(id)) {
        renderProjection();
    }

    // Guarda en el navegador y descarga una copia actualizada del MISMO archivo de sección.
    // Los navegadores no autorizan sobrescribir automáticamente el HTML local original.
    alert('Canción guardada. Se descargará el archivo actualizado de esta sección. Reemplaza el archivo del mismo nombre en la carpeta del cancionero para que aparezca junto a las demás canciones.');
    exportHTMLFile();
}

function deleteCurrentSong() {
    const id = document.getElementById('editSongId').value;
    if(id) {
        songs = songs.filter(s => s.id != id);
        localStorage.setItem(DB_KEY, JSON.stringify(songs));
        closeSongModal();
        closeProjection();
        filterSongs();
    }
}

function exportHTMLFile() {
    const clone = document.documentElement.cloneNode(true);
    const scripts = clone.querySelectorAll('script');
    scripts.forEach(script => {
        if (script.textContent.includes('const defaultSongs =')) {
            const currentSongsJSON = JSON.stringify(songs, null, 4);
            script.textContent = script.textContent.replace(
                /const defaultSongs = \[[\s\S]*?\];/, 
                `const defaultSongs = ${currentSongsJSON};`
            );
        }
    });

    const htmlContent = '<!DOCTYPE html>\n' + clone.outerHTML;
    const blob = new Blob([htmlContent], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '05-esp-ritu-santo.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
}

    renderAlphabet();
    filterSongs();
